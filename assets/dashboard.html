<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dsh-monitor-token" content="__MONITOR_TOKEN__">
<title>资源监控</title>
<style>
  [hidden] { display: none !important; }
  :root {
    color-scheme: light;
    --bg: #f4f6fb;
    --bg-soft: #eef1f8;
    --card: #ffffff;
    --card-soft: #f7f9fd;
    --text: #18202e;
    --text-2: #46536a;
    --muted: #75829a;
    --border: #e2e7f1;
    --track: #e8edf6;
    --accent: #3b7cf6;
    --accent-2: #6f5bff;
    --ok: #1f9d68;
    --warn: #c9821a;
    --danger: #d64545;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1218;
      --bg-soft: #141821;
      --card: #171c26;
      --card-soft: #1c222e;
      --text: #e9eef8;
      --text-2: #b3bed2;
      --muted: #7f8ba1;
      --border: #262e3d;
      --track: #232b39;
      --accent: #5b9bff;
      --accent-2: #8b7bff;
      --ok: #3fc38c;
      --warn: #e8ad4d;
      --danger: #f06a6a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .28);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1218;
    --bg-soft: #141821;
    --card: #171c26;
    --card-soft: #1c222e;
    --text: #e9eef8;
    --text-2: #b3bed2;
    --muted: #7f8ba1;
    --border: #262e3d;
    --track: #232b39;
    --accent: #5b9bff;
    --accent-2: #8b7bff;
    --ok: #3fc38c;
    --warn: #e8ad4d;
    --danger: #f06a6a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(1200px 500px at 80% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  header.top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 84%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .top-inner { padding: 14px 18px 12px; display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1 1 260px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    color: #fff; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .brand-mark svg { width: 21px; height: 21px; }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  .sub { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); }
  .sub b { color: var(--text-2); font-weight: 600; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  .field {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 9px;
    color: var(--muted); font-size: 12px; box-shadow: 0 1px 1px rgba(0,0,0,.03);
  }
  .field svg { width: 14px; height: 14px; flex: none; }
  .field input {
    border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; width: 132px; min-width: 60px;
  }
  .field input::placeholder { color: var(--muted); }
  select {
    appearance: none; border: 0; background: transparent; color: var(--text);
    font: inherit; outline: 0; cursor: pointer; padding-right: 2px;
  }
  select option { color: var(--text); background: var(--card); }
  .cselect-wrap { position: relative; display: inline-flex; align-items: center; }
  .cselect-native { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
  .cselect-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 2px;
    border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 500;
    cursor: pointer; white-space: nowrap;
  }
  .cselect-btn svg { width: 12px; height: 12px; color: var(--muted); transition: transform .15s ease; flex: none; }
  .cselect-wrap.open .cselect-btn svg { transform: rotate(180deg); color: var(--accent); }
  .cselect-menu {
    position: absolute; top: calc(100% + 6px); left: -10px; min-width: 152px; z-index: 90;
    padding: 4px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--card); box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
    display: flex; flex-direction: column; gap: 2px;
  }
  .cselect-menu[hidden] { display: none; }
  .cselect-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; border: 0; background: transparent; color: var(--text-2);
    font: inherit; font-size: 12px; text-align: left; padding: 7px 10px; border-radius: 7px;
    cursor: pointer; white-space: nowrap; transition: background .12s ease, color .12s ease;
  }
  .cselect-opt:hover { background: var(--card-soft); color: var(--text); }
  .cselect-opt.active {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent); font-weight: 600;
  }
  .cselect-opt .chk { font-size: 11px; opacity: 0; }
  .cselect-opt.active .chk { opacity: 1; }
  button.btn {
    height: 32px; display: inline-flex; align-items: center; gap: 6px;
    padding: 0 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font: inherit; font-weight: 600;
    cursor: pointer; transition: background .15s ease, transform .1s ease, border-color .15s ease;
  }
  button.btn:hover { background: var(--card-soft); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  button.btn:active { transform: translateY(1px); }
  button.btn.primary {
    border-color: transparent; color: #fff;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  button.btn.primary:hover { filter: brightness(1.06); }
  button.btn svg { width: 14px; height: 14px; }
  button.btn[disabled] { opacity: .55; cursor: default; }
  button.btn.ok { color: #fff; background: var(--ok); border-color: transparent; }
  button.btn.warn { color: #fff; background: #d9822b; border-color: transparent; }
  button.btn.danger { color: #fff; background: var(--bad); border-color: transparent; }
  button.btn.info { color: #fff; background: var(--accent); border-color: transparent; }
  button.btn.ok:hover, button.btn.warn:hover, button.btn.danger:hover, button.btn.info:hover { filter: brightness(1.07); }
  .spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner {
    margin: 12px 18px 0; padding: 9px 12px; border-radius: 10px; font-size: 12px;
    color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--card));
    border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--border));
  }
  .banner[hidden] { display: none; }

  main { flex: 1; padding: 16px 18px 26px; }
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
    align-items: stretch;
  }

  .card {
    position: relative; display: flex; flex-direction: column; min-width: 0;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 13px 14px 11px; overflow: hidden;
    transition: border-color .2s ease, transform .2s ease;
  }
  .card:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 26%, var(--border)); }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2) 55%, transparent);
    opacity: .85;
  }
  .card.local::before { background: linear-gradient(90deg, #8b7bff, #5b9bff 60%, transparent); }
  .card.offline::before { background: linear-gradient(90deg, var(--danger), color-mix(in srgb, var(--danger) 35%, transparent) 65%, transparent); }
  .card.connecting::before { background: linear-gradient(90deg, var(--warn), color-mix(in srgb, var(--warn) 30%, transparent) 65%, transparent); }
  .card.critical { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  /* A host we could not reach is deliberately monochrome; colour comes back on
     hover/focus so the reconnect and edit actions stay discoverable. */
  .card.offline { filter: grayscale(1); opacity: .78; }
  .card.offline:hover, .card.offline:focus-within { filter: none; opacity: 1; }

  .card-head { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
  .card.offline .dot { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 18%, transparent); }
  .card.connecting .dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .head-body { min-width: 0; flex: 1; }
  .name-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name { font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag {
    flex: none; font-size: 10px; line-height: 16px; padding: 0 6px; border-radius: 5px;
    color: var(--muted); background: var(--bg-soft); border: 1px solid var(--border);
  }
  .tag.local { color: color-mix(in srgb, var(--accent-2) 75%, var(--text)); border-color: color-mix(in srgb, var(--accent-2) 28%, var(--border)); background: color-mix(in srgb, var(--accent-2) 10%, var(--card)); }
  .tag.os { color: var(--text-2); }
  .host-line { margin-top: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

  .metrics { margin-top: 11px; display: flex; flex-direction: column; gap: 9px; }
  .metric-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .metric-label { font-size: 11px; color: var(--muted); letter-spacing: .3px; }
  .metric-val { font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .metric-val em { font-style: normal; font-weight: 500; font-size: 10.5px; color: var(--muted); margin-left: 5px; }
  .bar { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .55s cubic-bezier(.22,.61,.36,1); }
  .bar > i.ok { background: linear-gradient(90deg, color-mix(in srgb, var(--ok) 78%, var(--accent)), var(--ok)); }
  .bar > i.warn { background: linear-gradient(90deg, color-mix(in srgb, var(--warn) 70%, var(--accent)), var(--warn)); }
  .bar > i.bad { background: linear-gradient(90deg, color-mix(in srgb, var(--danger) 78%, var(--warn)), var(--danger)); }
  .metric-note { margin-top: 3px; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .metric-note.warn { color: var(--warn); }
  .metric-note.bad { color: var(--danger); }

  .card-foot {
    margin-top: 11px; padding-top: 9px; border-top: 1px dashed var(--border);
    display: flex; align-items: flex-end; gap: 8px 12px; flex-wrap: wrap;
    font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .card-foot span { white-space: nowrap; }
  .card-foot b { color: var(--text-2); font-weight: 600; }
  .spark { margin-left: auto; flex: none; opacity: .9; }
  .spark svg { display: block; width: 88px; height: 24px; overflow: visible; }

  .error-box {
    margin-top: 9px; padding: 7px 9px; border-radius: 8px; font-size: 11px; line-height: 1.45;
    color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, var(--card));
    border: 1px solid color-mix(in srgb, var(--danger) 24%, var(--border));
    overflow-wrap: anywhere;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 8px;
  }
  .error-msg { flex: 1 1 100%; min-width: 0; }
  .error-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .error-retry, .error-edit-btn {
    font: inherit; font-size: 10.5px; line-height: 1; padding: 5px 9px; border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--danger) 32%, var(--border));
    background: color-mix(in srgb, var(--danger) 8%, var(--card)); color: var(--danger);
    cursor: pointer; transition: background .15s ease, border-color .15s ease;
  }
  .error-retry:hover { background: color-mix(in srgb, var(--danger) 17%, var(--card)); border-color: color-mix(in srgb, var(--danger) 52%, var(--border)); }
  .error-retry[disabled] { opacity: .6; cursor: default; }
  .error-edit-btn { color: var(--text-2); border-color: var(--border); background: var(--card-soft); }
  .error-edit-btn:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
  .error-box .stale-note { display: block; color: var(--muted); margin-top: 2px; }
  .collecting {
    margin-top: 12px; padding: 14px 10px; border-radius: 9px; text-align: center;
    font-size: 11.5px; color: var(--warn);
    background: color-mix(in srgb, var(--warn) 8%, var(--card));
    border: 1px dashed color-mix(in srgb, var(--warn) 32%, var(--border));
  }

  .empty {
    margin: 48px auto; max-width: 420px; text-align: center; color: var(--muted);
  }
  .empty svg { width: 42px; height: 42px; opacity: .5; }
  .empty h2 { margin: 10px 0 4px; font-size: 14px; color: var(--text-2); }
  .empty p { margin: 0; font-size: 12px; }
  .empty button { margin-top: 14px; }
  .empty[hidden] { display: none; }

  .skeleton { pointer-events: none; }
  .sk-line { height: 11px; border-radius: 6px; background: linear-gradient(90deg, var(--track), color-mix(in srgb, var(--track) 55%, var(--card)), var(--track)); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; margin-bottom: 9px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  footer.foot { padding: 0 18px 18px; color: var(--muted); font-size: 10.5px; }
  footer.foot code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; }

  .modal[hidden] { display: none; }
  .modal {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(5, 8, 14, .62); backdrop-filter: blur(4px);
  }
  .modal-panel {
    width: min(740px, 100%); max-height: 88vh; overflow: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, .45);
  }
  .modal-head {
    position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--card);
  }
  .modal-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .icon-btn {
    width: 30px; height: 30px; display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: 8px; background: transparent;
    color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); background: var(--card-soft); }
  .modal-body { padding: 16px 18px 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .form-grid label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--muted); }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid input, .form-grid select, .form-grid textarea {
    width: 100%; padding: 7px 9px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--text);
    font: inherit; outline: none;
  }
  .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
    border-color: color-mix(in srgb, var(--accent) 58%, var(--border));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .form-grid textarea {
    min-height: 92px; resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px;
  }
  .form-actions { flex-direction: row; align-items: center; gap: 10px; margin-top: 2px; }
  .form-msg { font-size: 11px; color: var(--muted); }
  .form-msg.error { color: var(--danger); }
  .form-msg.ok { color: var(--ok); }
  .target-list { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .target-list h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .target-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding: 7px 9px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card-soft); font-size: 11px;
  }
  .target-row .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .target-row .who b { color: var(--text); font-weight: 600; }
  .target-row .danger {
    flex: none; border: 0; background: transparent; color: var(--danger);
    font: inherit; cursor: pointer; padding: 3px 5px; border-radius: 5px;
  }
  .target-row .danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .target-empty { padding: 10px 2px; font-size: 11px; color: var(--muted); }
  .scope-modes { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 10px; font-size: 11px; color: var(--text-2); }
  .scope-modes label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .scope-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-soft); font-size: 11px; }
  .scope-row input[type="checkbox"] { width: 14px; height: 14px; flex: none; cursor: pointer; }
  .scope-row .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .scope-row .who b { color: var(--text); font-weight: 600; }
  .scope-row .tag { flex: none; }
  .target-row .restore {
    flex: none; border: 0; background: transparent; color: var(--accent);
    font: inherit; cursor: pointer; padding: 3px 5px; border-radius: 5px;
  }
  .target-row .restore:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

  .card-actions { display: flex; align-items: center; gap: 2px; flex: none; margin: -3px -4px 0 0; }
  .card-monitor {
    flex: none; width: 24px; height: 24px; padding: 0; border-radius: 6px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border));
    background: transparent; color: var(--warn);
  }
  .card-monitor svg { width: 13px; height: 13px; display: block; }
  .card-monitor:hover { background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .card-monitor.paused { color: #22c55e; border-color: color-mix(in srgb, #22c55e 45%, var(--border)); }
  .card-monitor.paused:hover { background: color-mix(in srgb, #22c55e 12%, transparent); }
  .card.paused { opacity: .7; border-style: dashed; }
  .card.paused .dot { background: var(--muted); box-shadow: none; }
  .card-remove, .card-edit, .card-pin {
    flex: none; width: 26px; height: 26px; display: grid; place-items: center;
    border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer;
    opacity: .55; transition: opacity .15s ease, color .15s ease, background .15s ease;
  }
  .card:hover .card-remove, .card-remove:focus-visible,
  .card:hover .card-edit, .card-edit:focus-visible,
  .card:hover .card-pin, .card-pin:focus-visible,
  .card-pin.active { opacity: 1; }
  .card-pin.active { color: #f59e0b; }
  .card-pin:hover { color: #f59e0b; background: color-mix(in srgb, #f59e0b 12%, transparent); border-color: color-mix(in srgb, #f59e0b 28%, var(--border)); }
  .card-remove:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: color-mix(in srgb, var(--danger) 25%, var(--border)); }
  .card-edit:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: color-mix(in srgb, var(--accent) 25%, var(--border)); }
  .card-remove svg, .card-edit svg, .card-pin svg { width: 14px; height: 14px; }

  .cluster-bar {
    display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap;
    padding: 8px 18px; border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg-soft) 72%, transparent);
    font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums;
  }
  .cluster-bar[hidden] { display: none; }
  .cluster-stat { display: inline-flex; align-items: center; gap: 6px; }
  .cluster-stat b { color: var(--text); font-weight: 650; }
  .cluster-stat.warn b { color: var(--warn); }
  .cluster-stat.bad b { color: var(--danger); }
  .cluster-stat.ok b { color: var(--ok); }

  .tag-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .tag.group { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 26%, var(--border)); background: color-mix(in srgb, var(--accent) 9%, var(--card)); }
  .tag.container { color: #0ea5a4; border-color: color-mix(in srgb, #0ea5a4 28%, var(--border)); background: color-mix(in srgb, #0ea5a4 9%, var(--card)); }
  .gpu-chip.hot { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); background: color-mix(in srgb, var(--danger) 12%, var(--card)); font-weight: 650; }
  .net-chip { color: var(--text-2); }

  .list-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; background: var(--card); box-shadow: var(--shadow); }
  .list-wrap[hidden] { display: none; }
  table.list-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  table.list-table th {
    text-align: left; padding: 9px 12px; font-size: 11px; font-weight: 650; color: var(--muted);
    background: var(--bg-soft); border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.list-table td { padding: 9px 12px; border-bottom: 1px solid color-mix(in srgb, var(--border) 65%, transparent); vertical-align: middle; }
  table.list-table tbody tr { cursor: pointer; }
  table.list-table tbody tr:hover { background: var(--card-soft); }
  table.list-table tbody tr:last-child td { border-bottom: 0; }
  .custom-interval { display: inline-flex; align-items: center; gap: 4px; }
  .custom-interval[hidden] { display: none; }
  .custom-interval input {
    width: 58px; height: 28px; padding: 0 7px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit;
    font-variant-numeric: tabular-nums; outline: none;
  }
  .custom-interval input:focus { border-color: var(--accent); }
  .readonly-field { opacity: .78; cursor: not-allowed; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .gpu-list {
    margin-top: 2px; padding: 8px 0 6px;
    border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .gpu-title { font-size: 10px; color: var(--muted); letter-spacing: .35px; display: flex; justify-content: space-between; align-items: center; }
  .gpu-cards { display: flex; flex-direction: column; gap: 9px; }
  .gpu-row { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .gpu-top { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; min-width: 0; }
  .acc-badge {
    flex: none; font-size: 9.5px; font-weight: 700; line-height: 15px; padding: 0 5px; border-radius: 4px;
    letter-spacing: .3px; text-transform: uppercase;
  }
  .acc-badge.gpu { color: #2f7df6; background: color-mix(in srgb, #2f7df6 12%, var(--card)); border: 1px solid color-mix(in srgb, #2f7df6 28%, var(--border)); }
  .acc-badge.npu { color: #8b5cf6; background: color-mix(in srgb, #8b5cf6 12%, var(--card)); border: 1px solid color-mix(in srgb, #8b5cf6 28%, var(--border)); }
  .acc-badge.dcu { color: #0ea5a4; background: color-mix(in srgb, #0ea5a4 12%, var(--card)); border: 1px solid color-mix(in srgb, #0ea5a4 28%, var(--border)); }
  .gpu-name {
    flex: 1 1 120px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; font-weight: 600; color: var(--text-2);
  }
  .gpu-chips { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 0 0 auto; max-width: 100%; }
  .gpu-chip {
    flex: none; padding: 0 5px; border-radius: 5px; line-height: 16px;
    font-size: 10px; color: var(--muted); background: var(--bg-soft); border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .gpu-toggle {
    align-self: flex-start; border: 1px solid var(--border); background: var(--bg-soft);
    color: var(--accent); font: inherit; font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 7px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .gpu-toggle:hover { background: var(--card-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .acc-subbar { display: flex; flex-direction: column; gap: 3px; }
  .acc-subhead { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 10.5px; }
  .acc-stat { margin: 2px 0 1px; }
  .acc-subhead .lbl { color: var(--muted); }
  .acc-subhead .val { font-weight: 650; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .acc-subhead .val em { font-style: normal; font-weight: 500; color: var(--muted); margin-left: 5px; font-size: 10px; }
  .bar.sm { height: 5px; }

  .card.clickable { cursor: pointer; }
  .card-detail-hint {
    margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--accent);
    display: inline-flex; align-items: center; gap: 2px;
  }

  /* Drawer */
  .drawer-backdrop[hidden] { display: none; }
  .drawer-backdrop {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(5, 8, 14, .56); backdrop-filter: blur(4px);
    display: flex; justify-content: flex-end;
  }
  .drawer {
    width: min(840px, 96vw); height: 100%; background: var(--card);
    border-left: 1px solid var(--border); box-shadow: -16px 0 48px rgba(0, 0, 0, .35);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .drawer-head {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card);
  }
  .drawer-title-wrap { flex: 1; min-width: 180px; }
  .drawer-title { margin: 0; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .drawer-sub { margin: 2px 0 0; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .drawer-tools { display: flex; align-items: center; gap: 8px; }
  .toggle-pill {
    display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg-soft);
    font-size: 11.5px; color: var(--text-2); cursor: pointer; user-select: none;
  }
  .toggle-pill input { margin: 0; accent-color: var(--accent); }

  .drawer-tabs {
    display: flex; align-items: center; gap: 4px; padding: 8px 18px 0;
    border-bottom: 1px solid var(--border); background: var(--bg-soft);
  }
  .tab-btn {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-count {
    font-size: 10px; padding: 0 6px; border-radius: 99px; line-height: 16px;
    background: var(--card); border: 1px solid var(--border); color: var(--text-2);
  }

  .drawer-body { flex: 1; overflow: auto; padding: 14px 18px 22px; }
  .proc-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .proc-meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: auto; background: var(--card); max-height: 58vh; }
  table.proc-table { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  table.proc-table th {
    position: sticky; top: 0; z-index: 1; background: var(--bg-soft);
    text-align: left; font-weight: 650; color: var(--text-2); padding: 8px 10px;
    border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none;
  }
  table.proc-table th.sortable { cursor: pointer; }
  table.proc-table th.sortable:hover { color: var(--accent); }
  table.proc-table td {
    padding: 7px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
    vertical-align: middle;
  }
  table.proc-table tr:last-child td { border-bottom: 0; }
  table.proc-table tbody tr:hover { background: var(--card-soft); }
  .docker-section-title { margin: 14px 0 6px; font-size: 12px; font-weight: 650; color: var(--text-2); }
  .docker-actions { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .docker-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--card); }
  .docker-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .docker-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 650; color: var(--text); word-break: break-all; }
  .docker-head-actions { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; }
  .docker-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .docker-left input[type="checkbox"] { flex: none; accent-color: var(--accent); }
  .docker-batch-bar { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-soft); font-size: 11px; color: var(--text-2); }
  .docker-tree-toggle { margin-top: 7px; padding: 0; border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 10.5px; cursor: pointer; }
  .docker-tree { margin-top: 4px; display: grid; gap: 2px; }
  .docker-tree-item { text-align: left; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 10.5px; padding: 2px 4px; border-radius: 5px; cursor: pointer; }
  .docker-tree-item:hover { background: var(--bg-soft); color: var(--accent); }
  .docker-flash { animation: docker-flash 1.4s ease; }
  @keyframes docker-flash { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 0 2px var(--accent); } }
  .docker-card.docker-focus { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .docker-head-actions .btn { display: inline-flex; align-items: center; justify-content: center; }
  .docker-actions { display: inline-flex; align-items: center; gap: 6px; }
  button.btn.docker-action-btn { padding: 1px 8px; height: 22px; font-size: 10.5px; line-height: 18px; border-radius: 6px; }
  .docker-sub { margin-top: 4px; font-size: 10.5px; color: var(--muted); word-break: break-all; line-height: 1.5; }
  .docker-meta { margin-top: 7px; display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 10.5px; color: var(--text-2); }
  .proc-action-btn { padding: 1px 8px; height: 22px; font-size: 11px; line-height: 18px; border-radius: 6px; }
  .btn.proc-action-btn { background: transparent; border: 1px solid var(--border); color: var(--text-2); }
  .btn.proc-action-btn.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: transparent; }
  .btn.proc-action-btn.info { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: transparent; }
  .btn.proc-action-btn:hover { background: var(--bg-soft); }
  .docker-container-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--text-2); }
  .docker-detail-btn { min-width: 42px; }
  .docker-detail { margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--border); display: grid; gap: 5px; }
  .docker-detail-row { display: flex; gap: 9px; font-size: 10.5px; line-height: 1.5; }
  .docker-detail-row .k { flex: none; width: 64px; color: var(--muted); }
  .docker-detail-row .v { color: var(--text-2); word-break: break-all; }
  .docker-code {
    margin: 0; padding: 7px 8px; max-height: 180px; overflow: auto;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg-soft);
    color: var(--text-2); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
  }
  .docker-section { margin-top: 12px; }
  .docker-section-toggle {
    position: sticky; top: 0; z-index: 6; background: var(--bg);
    width: 100%; display: flex; align-items: center; gap: 7px; padding: 8px 9px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card-soft);
    color: var(--text-2); font: inherit; font-size: 11.5px; font-weight: 650; cursor: pointer; text-align: left;
  }
  .docker-section-toggle:hover { background: var(--bg-soft); }
  .docker-section-toggle .arrow { width: 12px; color: var(--muted); font-size: 10px; }
  .docker-section-body { margin-top: 8px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
  .cmd-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-meter { display: flex; align-items: center; gap: 7px; min-width: 92px; }
  .mini-meter .bar { flex: 1; height: 5px; }
  .mini-meter span { width: 38px; text-align: right; font-weight: 600; }

  .hw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .hw-box {
    padding: 12px 13px; border: 1px solid var(--border); border-radius: 11px;
    background: var(--card-soft); display: flex; flex-direction: column; gap: 8px;
  }
  .hw-box h4 { margin: 0; font-size: 12px; font-weight: 650; color: var(--text-2); }

  @media (max-width: 640px) {
    .top-inner { padding: 12px 14px 10px; }
    main { padding: 12px 14px 22px; }
    .grid { grid-template-columns: 1fr; }
    .actions { width: 100%; justify-content: flex-start; }
    .field input { width: 100px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar > i, .card, button.btn { transition: none; }
    .sk-line { animation: none; }
    .spin svg { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="6" rx="1.6"></rect>
            <rect x="3" y="14" width="18" height="6" rx="1.6"></rect>
            <path d="M7 7h.01M7 17h.01"></path>
          </svg>
        </div>
        <div style="min-width:0">
          <h1>资源监控</h1>
          <p class="sub" id="summary" aria-live="polite">正在连接采集服务…</p>
        </div>
      </div>
      <div class="actions">
        <label class="field" title="按名称或地址筛选">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
          <input id="q" type="search" placeholder="筛选服务器" autocomplete="off">
        </label>
        <label class="field" title="按状态或加速卡过滤">
          <select id="kind-filter" aria-label="状态过滤">
            <option value="all">全部节点</option>
            <option value="online">仅在线</option>
            <option value="accel">含 GPU / NPU / DCU</option>
            <option value="free-accel">有空闲算力卡</option>
            <option value="offline">离线 / 异常</option>
          </select>
        </label>
        <label class="field" title="按分组标签筛选">
          <select id="tag-filter" aria-label="标签筛选">
            <option value="">全部标签</option>
          </select>
        </label>
        <label class="field" title="排序方式">
          <select id="sort-by" aria-label="排序方式">
            <option value="default">显存剩余 ↓</option>
            <option value="cpu">CPU 占用 ↓</option>
            <option value="mem">内存占用 ↓</option>
            <option value="vram-avg">显存平均利用率 ↓</option>
          </select>
        </label>
        <button class="btn" id="view-toggle" type="button" title="切换卡片 / 列表视图">列表视图</button>
        <label class="field" id="ws-bind-wrap" hidden title="当前工作区绑定的服务器">
          <select id="ws-bind" aria-label="工作区服务器"></select>
        </label>
        <button class="btn" id="ws-show-all" type="button" hidden title="切换只看工作区服务器或查看全部服务器">查看全部</button>
        <label class="field" title="自动刷新间隔">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 1.8"></path></svg>
          <select id="interval" aria-label="刷新间隔">
            <option value="5000">5 秒</option>
<option value="10000">10 秒</option>
            <option value="30000">30 秒</option>
            <option value="60000">60 秒</option>
            <option value="0">手动</option>
            <option value="custom">自定义…</option>
          </select>
        </label>
        <span class="custom-interval" id="custom-interval-wrap" hidden>
          <input id="custom-interval-sec" type="number" min="1" max="3600" step="1" placeholder="秒" aria-label="自定义刷新秒数">
          <button class="btn" id="custom-interval-apply" type="button">应用</button>
        </span>
        <button class="btn" id="add-target" type="button" title="添加一台 SSH 服务器">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          添加服务器
        </button>
        <button class="btn primary" id="refresh" type="button" title="立即刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.1"></path><path d="M20 4v7h-7"></path></svg>
          刷新
        </button>
      </div>
    </div>
    <div class="cluster-bar" id="cluster-bar" hidden></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main>
    <div class="grid" id="grid" aria-live="polite"></div>
    <div class="list-wrap" id="list-wrap" hidden></div>
    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.6"></rect><rect x="3" y="14" width="18" height="6" rx="1.6"></rect><path d="M7 7h.01M7 17h.01"></path></svg>
      <h2>还没有可显示的服务器</h2>
      <p>请在 <code>~/.ssh/config</code> 中配置服务器，或点右上角“添加服务器”，然后刷新。</p>
      <button class="btn" type="button" id="empty-refresh">重新采集</button>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>

  <div class="modal" id="target-modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="target-title">
      <div class="modal-head">
        <h2 id="target-title">添加服务器</h2>
        <button class="icon-btn" id="target-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <form id="target-form" class="form-grid" autocomplete="off">
          <label>名称（可选）<input name="name" maxlength="80" placeholder="web-01"></label>
          <label>地址<input name="host" required maxlength="255" placeholder="192.0.2.10"></label>
          <label>端口<input name="port" type="number" min="1" max="65535" value="22" required></label>
          <label>用户名<input name="username" required maxlength="128" placeholder="deploy"></label>
          <label class="full">认证方式
            <select name="auth">
              <option value="password">密码</option>
              <option value="key">私钥</option>
            </select>
          </label>
          <div class="full" id="auth-password">
            <label>密码<input name="password" type="password" autocomplete="new-password" placeholder="SSH 登录密码"></label>
          </div>
          <div class="full" id="auth-key" hidden>
            <label>私钥内容<textarea name="privateKey" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea></label>
            <label>或选择私钥文件<input name="keyFile" type="file"></label>
            <label>私钥口令（可选）<input name="passphrase" type="password" placeholder="没有口令可留空"></label>
          </div>
          <div class="full form-actions">
            <button type="submit" class="btn primary" id="target-submit">保存并开始采集</button>
            <button type="button" class="btn" id="target-test">测试连接</button>
            <button type="button" class="btn" id="target-cancel-edit" hidden>取消编辑</button>
            <span class="form-msg" id="target-msg"></span>
          </div>
        </form>
        <div class="target-list">
          <h3>已添加的服务器</h3>
          <div id="target-rows"></div>
        </div>
        <div class="target-list">
          <h3>已隐藏的服务器</h3>
          <div id="hidden-rows"></div>
        </div>
        <div class="target-list">
          <h3>显示范围</h3>
