<script>
(function () {
  'use strict'

  var params = new URLSearchParams(location.search)
  var theme = params.get('theme')
  if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme)
  var isWorkspaceScope = params.get('scope') === 'workspace'
  var initialHostFilter = String(params.get('host') || '').trim()
  var workspaceSession = String(params.get('session') || '').trim()
  var workspacePath = String(params.get('path') || '').trim()
  var wsKey = String(params.get('ws') || 'default').trim() || 'default'
  var wsStorageKey = 'dsh-server-monitor:ws:' + wsKey

  var state = {
    data: null,
    error: null,
    busy: false,
    lastUpdate: 0,
    history: Object.create(null),
    accelHistory: Object.create(null),
    lastAccelStamp: 0,
    expandedAcc: Object.create(null),
    filter: '',
    kindFilter: 'all',
    tagFilter: '',
    sortBy: 'default',
    viewMode: 'grid',
    editingTargetId: null,
    wsShowAll: false,
    wsBoundHost: initialHostFilter,
    interval: 60000,
    quickRetries: 0,
    timer: null,
    ticker: null,
    drawerHostId: null,
    killTarget: null,
    dockerTarget: null,
    dockerInspectCache: Object.create(null),
    dockerSections: { images: false, running: false, stopped: false },
    dockerExpanded: Object.create(null),
    dockerSelected: { images: new Set(), containers: new Set() },
    dockerFocusId: null,
    dockerBatch: null,
    drawerTab: 'top',
    drawerData: null,
    drawerError: null,
    drawerLoading: false,
    drawerTimer: null,
    procFilter: '',
    procSortKey: 'cpuPercent',
    procSortDir: 'desc'
  }

  var els = {
    grid: document.getElementById('grid'),
    listWrap: document.getElementById('list-wrap'),
    clusterBar: document.getElementById('cluster-bar'),
    empty: document.getElementById('empty'),
    summary: document.getElementById('summary'),
    banner: document.getElementById('banner'),
    foot: document.getElementById('foot'),
    q: document.getElementById('q'),
    kindFilter: document.getElementById('kind-filter'),
    tagFilter: document.getElementById('tag-filter'),
    sortBy: document.getElementById('sort-by'),
    viewToggle: document.getElementById('view-toggle'),
    wsBindWrap: document.getElementById('ws-bind-wrap'),
    wsBind: document.getElementById('ws-bind'),
    wsShowAll: document.getElementById('ws-show-all'),
    interval: document.getElementById('interval'),
    customIntervalWrap: document.getElementById('custom-interval-wrap'),
    customIntervalSec: document.getElementById('custom-interval-sec'),
    customIntervalApply: document.getElementById('custom-interval-apply'),
    refresh: document.getElementById('refresh'),
    emptyRefresh: document.getElementById('empty-refresh'),
    addTarget: document.getElementById('add-target'),
    modal: document.getElementById('target-modal'),
    targetClose: document.getElementById('target-close'),
    targetForm: document.getElementById('target-form'),
    targetSubmit: document.getElementById('target-submit'),
    targetTest: document.getElementById('target-test'),
    targetCancelEdit: document.getElementById('target-cancel-edit'),
    targetRows: document.getElementById('target-rows'),
    hiddenRows: document.getElementById('hidden-rows'),
    scopeRows: document.getElementById('scope-rows'),
    scopeSave: document.getElementById('scope-save'),
    scopeAll: document.getElementById('scope-all'),
    scopeNone: document.getElementById('scope-none'),
    scopeMsg: document.getElementById('scope-msg'),
    targetMsg: document.getElementById('target-msg'),
    authSelect: document.querySelector('#target-form select[name="auth"]'),
    authPassword: document.getElementById('auth-password'),
    authKey: document.getElementById('auth-key'),
    aliasModal: document.getElementById('alias-modal'),
    killModal: document.getElementById('kill-modal'),
    killText: document.getElementById('kill-text'),
    killError: document.getElementById('kill-error'),
    killConfirm: document.getElementById('kill-confirm'),
    killForce: document.getElementById('kill-force'),
    killCancel: document.getElementById('kill-cancel'),
    killClose: document.getElementById('kill-close'),
    dockerModal: document.getElementById('docker-modal'),
    dockerText: document.getElementById('docker-text'),
    dockerError: document.getElementById('docker-error'),
    dockerConfirm: document.getElementById('docker-confirm'),
    dockerCancel: document.getElementById('docker-cancel'),
    dockerClose: document.getElementById('docker-close'),
    aliasClose: document.getElementById('alias-close'),
    aliasForm: document.getElementById('alias-form'),
    aliasMsg: document.getElementById('alias-msg'),
    drawerBackdrop: document.getElementById('detail-drawer'),
    drawerTitle: document.getElementById('drawer-title'),
    drawerSub: document.getElementById('drawer-sub'),
    drawerAuto: document.getElementById('drawer-auto'),
    drawerCopy: document.getElementById('drawer-copy'),
    drawerRefresh: document.getElementById('drawer-refresh'),
    drawerClose: document.getElementById('drawer-close'),
    drawerBody: document.getElementById('drawer-body'),
    tabCountTop: document.getElementById('tab-count-top'),
    tabCountVram: document.getElementById('tab-count-vram')
  }

  var tokenMeta = document.querySelector('meta[name="dsh-monitor-token"]')
  var writeToken = tokenMeta ? tokenMeta.getAttribute('content') || '' : ''

  var ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8v5"></path><circle cx="12" cy="16.6" r=".9" fill="currentColor"></circle><circle cx="12" cy="12" r="9"></circle></svg>'

  function el(tag, cls, text) {
    var node = document.createElement(tag)
    if (cls) node.className = cls
    if (text !== undefined && text !== null) node.textContent = String(text)
    return node
  }

  function clampPct(value) {
    var n = Number(value)
    if (!Number.isFinite(n)) return null
    return Math.min(100, Math.max(0, n))
  }

  function fmtPct(value) {
    var n = clampPct(value)
    if (n === null) return '—'
    return (n >= 10 ? Math.round(n) : Math.round(n * 10) / 10) + '%'
  }

  function fmtBytes(bytes) {
    var n = Number(bytes)
    if (!Number.isFinite(n) || n < 0) return '—'
    var units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB']
    var i = 0
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i += 1 }
    var digits = n >= 100 ? 0 : n >= 10 ? 1 : 2
    return n.toFixed(digits).replace(/\.0+$/, '') + ' ' + units[i]
  }

  function fmtRate(bps) {
    var n = Number(bps)
    if (!Number.isFinite(n) || n < 0) return null
    return fmtBytes(n) + '/s'
  }

  function accelKey(entry, gpu) {
    return String(entry.id || entry.host || '') + '|' + String(gpu.uuid || gpu.index || gpu.name || '')
  }

  /**
   * `nvidia-smi` / `npu-smi` report instantaneous utilization. Inference
   * workloads are bursty, so a 5s poll often catches 0% between requests even
   * while VRAM stays allocated. Keep the configured rolling window and expose
   * its average.
   */
  function trackAccelHistory(entries) {
    var now = Date.now()
    var windowMs = state.interval > 0 ? Math.max(1000, state.interval) : 60000
    var stamp = state.data && state.data.generatedAt ? state.data.generatedAt : 0
    var newSample = stamp !== 0 && state.lastAccelStamp !== stamp
    if (newSample) state.lastAccelStamp = stamp
    entries.forEach(function (entry) {
      ;(entry.gpus || []).forEach(function (gpu) {
        var key = accelKey(entry, gpu)
        var list = state.accelHistory[key] || []
        var value = Number(gpu.utilization)
        if (newSample && Number.isFinite(value)) list.push({ t: now, v: value })
        while (list.length > 0 && now - list[0].t > windowMs) list.shift()
        state.accelHistory[key] = list
        if (list.length > 0) {
          var sum = 0
          for (var i = 0; i < list.length; i += 1) sum += list[i].v
          gpu.utilAvg = Math.round((sum / list.length) * 10) / 10
          gpu.utilSamples = list.length
          gpu.utilWindowMs = windowMs
        }
      })
    })
  }

  /** Utilization to display: rolling average over the configured window. */
  function accelUtil(gpu) {
    var average = Number(gpu.utilAvg)
    if (Number.isFinite(average)) return average
    var current = Number(gpu.utilization)
    return Number.isFinite(current) ? current : null
  }

  function isFreeCard(gpu) {
    var u = accelUtil(gpu)
    var m = Number(gpu.memoryPercent)
    return (Number.isFinite(u) && u < 10) && (!Number.isFinite(m) || m < 10)
  }

  function isHotCard(gpu) {
    return gpu.temperature !== null && gpu.temperature !== undefined && Number(gpu.temperature) >= 85
  }

  function fmtUptime(seconds) {
    var s = Number(seconds)
    if (!Number.isFinite(s) || s < 0) return '—'
    var d = Math.floor(s / 86400)
    var h = Math.floor((s % 86400) / 3600)
    var m = Math.floor((s % 3600) / 60)
    if (d > 0) return d + ' 天 ' + h + ' 小时'
    if (h > 0) return h + ' 小时 ' + m + ' 分'
    return Math.max(1, m) + ' 分'
  }

  function fmtLoad(load) {
    if (!Array.isArray(load) || load.length < 3) return null
    return load.slice(0, 3).map(function (value) { return Number(value).toFixed(2) }).join(' / ')
  }

  function fmtRelative(ts) {
    var t = Number(ts)
    if (!Number.isFinite(t) || t <= 0) return '—'
    var diff = Math.max(0, Date.now() - t)
    if (diff < 1500) return '刚刚'
    if (diff < 60000) return Math.round(diff / 1000) + ' 秒前'
    if (diff < 3600000) return Math.round(diff / 60000) + ' 分钟前'
    if (diff < 86400000) return Math.round(diff / 3600000) + ' 小时前'
    return Math.round(diff / 86400000) + ' 天前'
  }

  function toneFor(pct) {
    var n = clampPct(pct)
    if (n === null) return ''
    if (n >= 88) return 'bad'
    if (n >= 70) return 'warn'
    return 'ok'
  }

  function metric(label, pct, note, noteTone) {
    var row = el('div', 'metric')
    var head = el('div', 'metric-head')
    head.appendChild(el('span', 'metric-label', label))
    var value = el('span', 'metric-val', fmtPct(pct))
    if (note && note.short) {
      var em = el('em', '', note.short)
      value.appendChild(em)
    }
    head.appendChild(value)
    row.appendChild(head)
    var bar = el('div', 'bar')
    var fill = el('i', toneFor(pct))
    fill.style.width = (clampPct(pct) === null ? 0 : clampPct(pct)) + '%'
    bar.appendChild(fill)
    row.appendChild(bar)
    if (note && note.text) {
      var noteEl = el('div', 'metric-note' + (noteTone ? ' ' + noteTone : ''), note.text)
      noteEl.title = note.text
      row.appendChild(noteEl)
    }
    return row
  }

  function sparkline(entry) {
    var key = entry.id
    var history = state.history[key] || []
    if (entry.status === 'online' && entry.cpu && entry.cpu.usage !== null && entry.cpu.usage !== undefined) {
      history.push(clampPct(entry.cpu.usage) || 0)
      if (history.length > 40) history.shift()
      state.history[key] = history
    }
    var points = state.history[key] || []
    if (points.length < 2) return null
    var w = 88
    var h = 24
    var max = Math.max(30, Math.max.apply(null, points))
    var step = w / (points.length - 1)
    var coords = points.map(function (value, index) {
      return (index * step).toFixed(1) + ',' + (h - (Math.min(max, value) / max) * (h - 3) - 1.5).toFixed(1)
    })
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h)
    svg.setAttribute('preserveAspectRatio', 'none')
    svg.setAttribute('aria-hidden', 'true')
    var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs')
    var grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient')
    grad.setAttribute('id', 'sg-' + String(key).replace(/[^a-zA-Z0-9_-]/g, ''))
    grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0'); grad.setAttribute('x2', '1'); grad.setAttribute('y2', '0')
    var stops = [['0', 'var(--accent)'], ['1', 'var(--accent-2)']]
    stops.forEach(function (pair) {
      var stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop')
      stop.setAttribute('offset', pair[0])
      stop.setAttribute('stop-color', pair[1])
      grad.appendChild(stop)
    })
    defs.appendChild(grad)
    svg.appendChild(defs)
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline')
    line.setAttribute('points', coords.join(' '))
    line.setAttribute('fill', 'none')
    line.setAttribute('stroke', 'url(#sg-' + String(key).replace(/[^a-zA-Z0-9_-]/g, '') + ')')
    line.setAttribute('stroke-width', '1.6')
    line.setAttribute('stroke-linejoin', 'round')
    line.setAttribute('stroke-linecap', 'round')
    svg.appendChild(line)
    var wrap = el('div', 'spark')
    wrap.title = '最近 ' + points.length + ' 次 CPU 采样'
    wrap.appendChild(svg)
    return wrap
  }

  function accLabel(type) {
    if (type === 'npu') return 'NPU'
    if (type === 'dcu') return 'DCU'
    return 'GPU'
  }

  function renderSubBar(label, pct, rightText) {
    var wrap = el('div', 'acc-subbar')
    var head = el('div', 'acc-subhead')
    head.appendChild(el('span', 'lbl', label))
    var val = el('span', 'val', fmtPct(pct))
    if (rightText) val.appendChild(el('em', '', rightText))
    head.appendChild(val)
    wrap.appendChild(head)
    var bar = el('div', 'bar sm')
    var fill = el('i', toneFor(pct))
    fill.style.width = (clampPct(pct) === null ? 0 : clampPct(pct)) + '%'
    bar.appendChild(fill)
    wrap.appendChild(bar)
    return wrap
  }

  function renderAcceleratorRow(gpu, index) {
    var type = (gpu.type === 'npu' || gpu.type === 'dcu') ? gpu.type : 'gpu'
    var gpuRow = el('div', 'gpu-row')
    var gpuTop = el('div', 'gpu-top')
    gpuTop.appendChild(el('span', 'acc-badge ' + type, accLabel(type)))
    var idxPrefix = (gpu.index !== undefined && gpu.index !== null) ? '#' + gpu.index + ' ' : ''
    var gpuName = el('span', 'gpu-name', idxPrefix + (gpu.name || (accLabel(type) + ' ' + index)))
    gpuName.title = gpu.name || ''
    gpuTop.appendChild(gpuName)
    var envParts = []
    if (gpu.temperature !== null && gpu.temperature !== undefined) envParts.push(Math.round(gpu.temperature) + '°C')
    if (envParts.length || gpu.computeCap) {
      var chips = el('span', 'gpu-chips')
      if (envParts.length) {
        var envChip = el('span', 'gpu-chip' + (isHotCard(gpu) ? ' hot' : ''), envParts.join(' · '))
        if (isHotCard(gpu)) envChip.title = '芯片温度偏高（≥ 85°C）'
        chips.appendChild(envChip)
      }
      if (gpu.computeCap) chips.appendChild(el('span', 'gpu-chip', 'CC ' + gpu.computeCap))
      gpuTop.appendChild(chips)
    }
    gpuRow.appendChild(gpuTop)

    var utilRow = el('div', 'acc-subhead acc-stat')
    utilRow.appendChild(el('span', 'lbl', '平均利用率'))
    var utilVal = el('span', 'val', fmtPct(accelUtil(gpu)))
    if (gpu.utilSamples) {
      var windowSec = Math.max(10, Math.round((Number(gpu.utilWindowMs) || state.accelWindowMs) / 1000))
      utilVal.title = '最近 ' + windowSec + ' 秒内 ' + gpu.utilSamples + ' 个样本的平均值'    }
    utilRow.appendChild(utilVal)
    gpuRow.appendChild(utilRow)

    var powerText = (gpu.powerW !== null && gpu.powerW !== undefined)
      ? Math.round(gpu.powerW) + ' W'
      : '—'
    if (gpu.powerLimit !== null && gpu.powerLimit !== undefined) {
      powerText += ' / ' + Math.round(gpu.powerLimit) + ' W'
    }
    var powerRow = el('div', 'acc-subhead acc-stat')
    powerRow.appendChild(el('span', 'lbl', '功耗'))
    powerRow.appendChild(el('span', 'val', powerText))
    gpuRow.appendChild(powerRow)

    var memText = (gpu.memoryUsed !== null && gpu.memoryUsed !== undefined && gpu.memoryTotal)
      ? fmtBytes(gpu.memoryUsed) + ' / ' + fmtBytes(gpu.memoryTotal)
      : ''
    gpuRow.appendChild(renderSubBar(gpu.memoryLabel || '显存', gpu.memoryPercent, memText))
    return gpuRow
  }

  function card(entry) {
    var offline = entry.status === 'offline'
    var connecting = entry.status === 'connecting'
    var paused = entry.status === 'paused'
    var hotAcc = !offline && !connecting && (entry.gpus || []).some(isHotCard)
    var critical = !offline && !connecting && (hotAcc || Number(entry.disk && entry.disk.percent) >= 92 || Number(entry.memory && entry.memory.percent) >= 92)
    var node = el('article', 'card' + (offline ? ' offline' : '') + (connecting ? ' connecting' : '') + (entry.kind === 'local' ? ' local' : '') + (critical ? ' critical' : '') + (paused ? ' paused' : '') + (!offline && !connecting && !paused ? ' clickable' : ''))
    if (!offline && !connecting && !paused) {
      node.title = '点击查看占用详情'
      node.addEventListener('click', function () {
        openDrawer(entry)
      })
    }

    var head = el('div', 'card-head')
    head.appendChild(el('span', 'dot'))
    var body = el('div', 'head-body')
    var nameRow = el('div', 'name-row')
    var name = el('span', 'name', entry.name || entry.host || '未命名')
    name.title = entry.name || entry.host || ''
    nameRow.appendChild(name)
    if (entry.kind === 'local') nameRow.appendChild(el('span', 'tag local', '本机'))
    var platformText = entry.platform === 'windows' ? 'Windows'
      : entry.platform === 'macos' ? 'macOS'
      : entry.platform === 'linux' ? 'Linux' : (entry.platform || 'SSH')
    if (!offline || entry.osName) nameRow.appendChild(el('span', 'tag os', platformText))
    body.appendChild(nameRow)

    var hostText
    if (entry.kind === 'local') {
      hostText = [entry.hostname || entry.host, entry.osName].filter(Boolean).join(' · ') || '本机'
    } else {
      var who = entry.username ? entry.username + '@' : ''
      hostText = who + (entry.host || '') + (entry.port ? ':' + entry.port : '')
      if (entry.hostname && entry.hostname !== entry.host) hostText += ' · ' + entry.hostname
    }
    var hostLine = el('div', 'host-line', hostText)
    hostLine.title = hostText
    body.appendChild(hostLine)

    if ((entry.container && entry.container.isContainer) || (entry.tags && entry.tags.length)) {
      var tagRow = el('div', 'tag-row')
      if (entry.container && entry.container.isContainer) {
        var cParts = ['容器']
        if (entry.container.cpuLimit) cParts.push(entry.container.cpuLimit + '核')
        if (entry.container.memLimitBytes) cParts.push(fmtBytes(entry.container.memLimitBytes))
        tagRow.appendChild(el('span', 'tag container', cParts.join(' · ')))
      }
      ;(entry.tags || []).forEach(function (t) {
        tagRow.appendChild(el('span', 'tag group', t))
      })
      body.appendChild(tagRow)
    }

    head.appendChild(body)
    var actionsWrap = el('div', 'card-actions')
    actionsWrap.appendChild(monitorButton(entry))
    var editBtn = el('button', 'card-edit')
    editBtn.type = 'button'
    var editable = Boolean(entry.manualId)
    editBtn.title = editable ? '编辑凭据并重连（地址与端口不可调整）' : '自定义服务器名称（IP 地址不可调整）'
    editBtn.setAttribute('aria-label', editable ? '编辑凭据' : '自定义服务器名称')
    editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>'
    editBtn.addEventListener('click', function (event) {
      event.stopPropagation()
      if (editable) editManualTarget(entry)
      else openAliasModal(entry)
    })
    actionsWrap.appendChild(editBtn)
    if (entry.kind !== 'local') {
      var remove = el('button', 'card-remove')
      remove.type = 'button'
      remove.title = entry.manualId ? '删除这台服务器' : '从监控列表移除（不修改 ~/.ssh/config）'
      remove.setAttribute('aria-label', '删除服务器')
      remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>'
      remove.addEventListener('click', function (event) {
        event.stopPropagation()
        removeServer(entry)
      })
      actionsWrap.appendChild(remove)
    }
    head.appendChild(actionsWrap)
    node.appendChild(head)

    if (connecting) {
      var waiting = el('div', 'collecting', '正在加载资源监控…')
      waiting.title = '来源：~/.ssh/config'
      node.appendChild(waiting)
    } else if (offline) {
      var box = el('div', 'error-box')
      var message = el('div', 'error-msg')
      message.appendChild(document.createTextNode((entry.error && entry.error.message) || '离线'))
      if (entry.stale && entry.lastSuccessAt) {
        message.appendChild(el('span', 'stale-note', '显示的是 ' + fmtRelative(entry.lastSuccessAt) + '的最后一次数据'))
      }
      box.appendChild(message)
      box.appendChild(errorActions(entry))
      node.appendChild(box)
    } else {
      var cpu = entry.cpu || {}
      var cores = cpu.cores ? cpu.cores + ' 核' : ''
      var metrics = el('div', 'metrics')
      metrics.appendChild(metric('CPU', cpu.usage, {
        short: cores,
        text: cpu.model || (entry.load ? '负载 ' + fmtLoad(entry.load) : '')
      }))

      // 第二行：GPU / NPU / DCU（超过 2 张自动收起，点击可展开/收起）
      if (entry.gpus && entry.gpus.length) {
        var gpuWrap = el('div', 'gpu-list')
        var kinds = []
        if (entry.gpus.some(function (g) { return !g.type || g.type === 'gpu' })) kinds.push('GPU')
        if (entry.gpus.some(function (g) { return g.type === 'npu' })) kinds.push('NPU')
        if (entry.gpus.some(function (g) { return g.type === 'dcu' })) kinds.push('DCU')
        var titleEl = el('div', 'gpu-title')
        titleEl.appendChild(el('span', '', (kinds.join(' / ') || '算力卡') + (entry.gpus.length > 1 ? ' · ' + entry.gpus.length + ' 张' : '')))
        gpuWrap.appendChild(titleEl)

        var isExpanded = Boolean(state.expandedAcc[entry.id])
        var limit = entry.gpus.length > 2 && !isExpanded ? 2 : entry.gpus.length
        var cardsBox = el('div', 'gpu-cards')
        for (var gi = 0; gi < limit; gi += 1) {
          cardsBox.appendChild(renderAcceleratorRow(entry.gpus[gi], gi))
        }
        gpuWrap.appendChild(cardsBox)

        if (entry.gpus.length > 2) {
          var toggleBtn = el(
            'button',
            'gpu-toggle',
            isExpanded
              ? '收起算力卡 ▴'
              : '展开全部 ' + entry.gpus.length + ' 张卡 (+' + (entry.gpus.length - 2) + ') ▾'
          )
          toggleBtn.type = 'button'
          toggleBtn.addEventListener('click', function (event) {
            event.stopPropagation()
            state.expandedAcc[entry.id] = !state.expandedAcc[entry.id]
            render()
          })
          gpuWrap.appendChild(toggleBtn)
        }
        metrics.appendChild(gpuWrap)
      }

      var mem = entry.memory || {}
      var memNote = (mem.used !== null && mem.used !== undefined && mem.total)
        ? fmtBytes(mem.used) + ' / ' + fmtBytes(mem.total)
        : ''
      if (entry.swap && entry.swap.percent !== null && entry.swap.percent > 5) {
        memNote += ' · Swap ' + fmtPct(entry.swap.percent)
      }
      metrics.appendChild(metric('内存', mem.percent, { text: memNote || '—' }))

      var disk = entry.disk || {}
      var capacity = (disk.used !== null && disk.used !== undefined && disk.total)
        ? fmtBytes(disk.used) + ' / ' + fmtBytes(disk.total)
        : ''
      var diskNote = capacity
      var diskTone = ''
      if (disk.mounts && disk.mounts.length > 1) {
        diskNote += (diskNote ? ' · ' : '') + '峰值 ' + (disk.mount || '—')
        if (disk.root && disk.root.mount && disk.root.mount !== disk.mount) {
          diskNote += ' · 根分区 ' + fmtPct(disk.root.percent)
        }
        if (Number(disk.percent) >= 92) diskTone = 'bad'
        else if (Number(disk.percent) >= 85) diskTone = 'warn'
      } else if (disk.mount) {
        diskNote += (diskNote ? ' · ' : '') + '挂载 ' + disk.mount
      }
      metrics.appendChild(metric('磁盘', disk.percent, { text: diskNote || '—' }, diskTone))
      node.appendChild(metrics)
    }

    var foot = el('div', 'card-foot')
    if (connecting) {
      foot.appendChild(el('span', '', '首次采集进行中'))
    } else if (entry.kind === 'local') {
      foot.appendChild(el('span', '', '运行 ' + fmtUptime(entry.uptime)))
    } else {
      if (entry.load) foot.appendChild(el('span', '', '负载 ' + fmtLoad(entry.load)))
      else if (entry.processes && entry.processes.total) foot.appendChild(el('span', '', entry.processes.total + ' 进程'))
      if (entry.uptime) foot.appendChild(el('span', '', '运行 ' + fmtUptime(entry.uptime)))
      if (entry.latencyMs !== null && entry.latencyMs !== undefined) foot.appendChild(el('span', '', entry.latencyMs + ' ms'))
    }
    if (!offline && !connecting && entry.network && entry.network.rxBps !== null && entry.network.rxBps !== undefined) {
      foot.appendChild(el('span', 'net-chip', '↓ ' + fmtRate(entry.network.rxBps) + ' · ↑ ' + fmtRate(entry.network.txBps)))
    }
    var stamp = el('span', '', offline ? '离线' : connecting ? '采集中' : '更新 ' + fmtRelative(entry.sampledAt || state.lastUpdate))
    stamp.setAttribute('data-stamp', String(entry.sampledAt || 0))
    foot.appendChild(stamp)
    var spark = sparkline(entry)
    if (spark) foot.appendChild(spark)
    if (!offline && !connecting) {
      foot.appendChild(el('span', 'card-detail-hint', '占用详情 ›'))
    }
    node.appendChild(foot)
    return node
  }

  function skeleton() {
    for (var i = 0; i < 3; i += 1) {
      var node = el('article', 'card skeleton')
      node.appendChild(el('div', 'sk-line')).style.width = '55%'
      node.appendChild(el('div', 'sk-line')).style.width = '35%'
      for (var j = 0; j < 3; j += 1) node.appendChild(el('div', 'sk-line'))
      els.grid.appendChild(node)
    }
  }

  function matches(entry, query) {
    if (state.kindFilter === 'online' && entry.status !== 'online') return false
    if (state.kindFilter === 'offline' && entry.status !== 'offline') return false
    if (state.kindFilter === 'accel' && (!entry.gpus || entry.gpus.length === 0)) return false
    if (state.kindFilter === 'free-accel' && (entry.status !== 'online' || !(entry.gpus || []).some(isFreeCard))) return false
    if (state.tagFilter && !(entry.tags || []).includes(state.tagFilter)) return false
    if (!query) return true
    var accNames = (entry.gpus || []).map(function (g) { return g.name + ' ' + (g.type || '') }).join(' ')
    var hay = [entry.name, entry.host, entry.hostname, entry.username, entry.osName, accNames, (entry.tags || []).join(' ')].join(' ').toLowerCase()
    return hay.indexOf(query) >= 0
  }

  function peakAccelUtil(entry) {
    var list = entry.gpus || []
    if (!list.length) return -1
    var best = -1
    list.forEach(function (g) {
      var u = Number(accelUtil(g))
      if (Number.isFinite(u) && u > best) best = u
    })
    return best
  }

  function accelFreeBytes(entry) {
    var total = 0
    ;(entry.gpus || []).forEach(function (g) {
      var used = Number(g.memoryUsed)
      var capacity = Number(g.memoryTotal)
      if (Number.isFinite(used) && Number.isFinite(capacity) && capacity > used) total += capacity - used
    })
    return total
  }

  function avgAccelMem(entry) {
    var list = entry.gpus || []
    if (!list.length) return -1
    var sum = 0
    var count = 0
    list.forEach(function (g) {
      var m = Number(g.memoryPercent)
      if (Number.isFinite(m)) {
        sum += m
        count += 1
      }
    })
    return count === 0 ? -1 : sum / count
  }

  function sortEntries(list) {
    return list.slice().sort(function (a, b) {
      var aLocal = a.kind === 'local'
      var bLocal = b.kind === 'local'
      if (aLocal !== bLocal) return aLocal ? -1 : 1
      if (state.sortBy === 'default') {
        var freeDiff = accelFreeBytes(b) - accelFreeBytes(a)
        if (freeDiff !== 0) return freeDiff
        return String(a.name).localeCompare(String(b.name), 'zh-Hans-CN')
      }
      if (Boolean(a.pinned) !== Boolean(b.pinned)) return a.pinned ? -1 : 1
      if (state.sortBy === 'cpu') return (Number(b.cpu && b.cpu.usage) || -1) - (Number(a.cpu && a.cpu.usage) || -1)
      if (state.sortBy === 'mem') return (Number(b.memory && b.memory.percent) || -1) - (Number(a.memory && a.memory.percent) || -1)
      if (state.sortBy === 'vram-avg' || state.sortBy === 'accel') return avgAccelMem(b) - avgAccelMem(a)
      return 0
    })
  }

  function syncTagOptions(entries) {
    var tags = []
    var seen = Object.create(null)
    entries.forEach(function (entry) {
      ;(entry.tags || []).forEach(function (t) {
        if (!seen[t]) {
          seen[t] = true
          tags.push(t)
        }
      })
    })
    tags.sort()
    var prev = state.tagFilter
    els.tagFilter.textContent = ''
    els.tagFilter.appendChild(new Option('全部标签', ''))
    tags.forEach(function (t) {
      els.tagFilter.appendChild(new Option('标签: ' + t, t))
    })
    els.tagFilter.value = seen[prev] ? prev : ''
    if (!seen[prev]) state.tagFilter = ''
    if (els.tagFilter._syncCustom) els.tagFilter._syncCustom()
  }

  function renderClusterBar(entries) {
    var onlineList = entries.filter(function (e) { return e.status === 'online' })
    var offlineCount = entries.filter(function (e) { return e.status === 'offline' }).length
    var totalCards = 0
    var freeCards = 0
    var vramUsed = 0
    var vramTotal = 0
    var hotCards = 0
    var highLoadHosts = 0
    onlineList.forEach(function (e) {
      if (Number(e.memory && e.memory.percent) >= 92 || Number(e.disk && e.disk.percent) >= 92) highLoadHosts += 1
      ;(e.gpus || []).forEach(function (g) {
        totalCards += 1
        if (isFreeCard(g)) freeCards += 1
        if (isHotCard(g)) hotCards += 1
        if (g.memoryUsed) vramUsed += Number(g.memoryUsed) || 0
        if (g.memoryTotal) vramTotal += Number(g.memoryTotal) || 0
      })
    })
    var alertCount = offlineCount + highLoadHosts + hotCards
    document.title = (alertCount > 0 ? '(' + alertCount + ' 异常) ' : '') + '资源监控'

    els.clusterBar.textContent = ''
    if (!entries.length) {
      els.clusterBar.hidden = true
      return
    }
    els.clusterBar.hidden = false
    function addStat(label, val, cls) {
      var box = el('span', 'cluster-stat' + (cls ? ' ' + cls : ''))
      box.appendChild(document.createTextNode(label + ' '))
      box.appendChild(el('b', '', val))
      els.clusterBar.appendChild(box)
    }
    addStat('在线主机', onlineList.length + ' / ' + entries.length, offlineCount > 0 ? 'warn' : 'ok')
    if (totalCards > 0) {
      addStat('算力卡', totalCards + ' 张（空闲 ' + freeCards + ' 张）', freeCards > 0 ? 'ok' : '')
      if (vramTotal > 0) {
        addStat('集群显存', fmtBytes(vramUsed) + ' / ' + fmtBytes(vramTotal) + ' (' + fmtPct((vramUsed / vramTotal) * 100) + ')')
      }
    }
    if (alertCount > 0) {
      var reasons = []
      if (offlineCount) reasons.push(offlineCount + ' 离线')
      if (highLoadHosts) reasons.push(highLoadHosts + ' 资源告急')
      if (hotCards) reasons.push(hotCards + ' 卡高温≥85°C')
      addStat('异常提醒', reasons.join(' · '), 'bad')
    }
  }

  function renderListView(visible) {
    els.listWrap.textContent = ''
    var table = el('table', 'list-table')
    var thead = document.createElement('thead')
    var htr = document.createElement('tr')
    ;['监控', '服务器', 'CPU', '内存', '磁盘', 'GPU / NPU / DCU', '网络速率', '状态 / 延迟'].forEach(function (lbl) {
      htr.appendChild(el('th', '', lbl))
    })
    thead.appendChild(htr)
    table.appendChild(thead)

    var tbody = document.createElement('tbody')
    visible.forEach(function (entry) {
      var offline = entry.status === 'offline'
      var connecting = entry.status === 'connecting'
      var paused = entry.status === 'paused'
      var tr = document.createElement('tr')
      if (!offline && !connecting && !paused) {
        tr.addEventListener('click', function () { openDrawer(entry) })
      }
      var monitorTd = document.createElement('td')
      monitorTd.appendChild(monitorButton(entry))
      tr.appendChild(monitorTd)

      var nameTd = document.createElement('td')
      nameTd.appendChild(el('b', '', entry.name || entry.host))
      var subAddr = entry.kind === 'local' ? '本机' : ((entry.username ? entry.username + '@' : '') + entry.host + ':' + (entry.port || 22))
      nameTd.appendChild(el('div', 'host-line', subAddr))
      tr.appendChild(nameTd)

      var cpuTd = document.createElement('td')
      cpuTd.appendChild(offline || connecting ? el('span', '', '—') : miniMeter(entry.cpu && entry.cpu.usage, fmtPct(entry.cpu && entry.cpu.usage)))
      tr.appendChild(cpuTd)

      var memTd = document.createElement('td')
      memTd.appendChild(offline || connecting ? el('span', '', '—') : miniMeter(entry.memory && entry.memory.percent, fmtPct(entry.memory && entry.memory.percent)))
      tr.appendChild(memTd)

      var diskTd = document.createElement('td')
      diskTd.appendChild(offline || connecting ? el('span', '', '—') : miniMeter(entry.disk && entry.disk.percent, fmtPct(entry.disk && entry.disk.percent)))
      tr.appendChild(diskTd)

      var accTd = document.createElement('td')
      var gpus = entry.gpus || []
      if (!gpus.length) {
        accTd.textContent = '—'
      } else {
        var freeC = gpus.filter(isFreeCard).length
        var peakU = peakAccelUtil(entry)
        accTd.textContent = gpus.length + ' 张卡 · 峰值 ' + fmtPct(peakU) + (freeC > 0 ? ' (空闲 ' + freeC + ')' : '')
      }
      tr.appendChild(accTd)

      var netTd = el('td', 'mono')
      netTd.textContent = (entry.network && entry.network.rxBps !== null && entry.network.rxBps !== undefined)
        ? ('↓' + fmtRate(entry.network.rxBps) + ' ↑' + fmtRate(entry.network.txBps))
        : '—'
      tr.appendChild(netTd)

      var statusTd = document.createElement('td')
      statusTd.textContent = offline ? '离线' : connecting ? '采集中' : ((entry.latencyMs !== null && entry.latencyMs !== undefined) ? entry.latencyMs + ' ms' : '在线')
      tr.appendChild(statusTd)
      tbody.appendChild(tr)
    })
    table.appendChild(tbody)
    els.listWrap.appendChild(table)
  }

  function resolveWorkspaceEntry(entries, target) {
    if (!target) return null
    var q = String(target).trim().toLowerCase()
    if (!q) return null
    if (q === 'local') {
      return entries.find(function (e) { return e.kind === 'local' }) || null
    }
    var exact = entries.find(function (e) {
      return String(e.id || '').toLowerCase() === q
        || String(e.host || '').toLowerCase() === q
        || String(e.hostname || '').toLowerCase() === q
    })
    if (exact) return exact
    return entries.find(function (e) {
      return String(e.name || '').toLowerCase() === q
        || String(e.host || '').toLowerCase().indexOf(q) >= 0
        || String(e.hostname || '').toLowerCase().indexOf(q) >= 0
    }) || null
  }

  function syncWorkspaceSelector(entries) {
    if (!isWorkspaceScope) {
      els.wsBindWrap.hidden = true
      els.wsShowAll.hidden = true
      return
    }
    els.wsBindWrap.hidden = false
    els.wsShowAll.hidden = false
    els.wsShowAll.textContent = state.wsShowAll ? '仅看工作区' : '查看全部'
    els.wsBind.textContent = ''
    els.wsBind.appendChild(new Option('选择工作区服务器…', ''))
    entries.forEach(function (e) {
      var lbl = (e.name || e.host) + (e.kind === 'local' ? ' (本机)' : ' (' + e.host + ')')
      els.wsBind.appendChild(new Option(lbl, e.id))
    })
    var matched = resolveWorkspaceEntry(entries, state.wsBoundHost)
    els.wsBind.value = matched ? matched.id : ''
    if (els.wsBind._syncCustom) els.wsBind._syncCustom()
  }

  function render() {
    var data = state.data
    els.empty.hidden = true
    els.grid.textContent = ''
    els.listWrap.textContent = ''

    if (!data) {
      els.listWrap.hidden = true
      els.grid.hidden = false
      if (state.error) {
        els.empty.hidden = false
      } else {
        skeleton()
      }
      return
    }

    var entries = []
    if (data.local) entries.push(data.local)
    entries = entries.concat(data.remotes || [])
    trackAccelHistory(entries)
    syncWorkspaceSelector(entries)
    syncTagOptions(entries)

    var visible
    if (isWorkspaceScope && !state.wsShowAll) {
      var targetEntry = resolveWorkspaceEntry(entries, state.wsBoundHost)
      if (!targetEntry && entries.length === 1) targetEntry = entries[0]
      if (targetEntry) {
        visible = [targetEntry]
        els.clusterBar.hidden = true
      } else {
        visible = []
        els.clusterBar.hidden = true
      }
    } else {
      renderClusterBar(entries)
      visible = sortEntries(entries.filter(function (entry) { return matches(entry, state.filter) }))
    }

    if (entries.length === 0) {
      els.listWrap.hidden = true
      els.grid.hidden = false
      els.empty.hidden = false
      return
    }

    if (visible.length === 0) {
      els.listWrap.hidden = true
      els.grid.hidden = false
      els.empty.hidden = false
      var emptyTitle = els.empty.querySelector('h2')
      if (emptyTitle) emptyTitle.textContent = isWorkspaceScope ? '当前工作区还没有绑定服务器' : '没有匹配的服务器'
      return
    }

    if (state.viewMode === 'list') {
      els.grid.hidden = true
      els.listWrap.hidden = false
      renderListView(visible)
    } else {
      els.listWrap.hidden = true
      els.grid.hidden = false
      visible.forEach(function (entry) { els.grid.appendChild(card(entry)) })
    }

    var online = entries.filter(function (entry) { return entry.status === 'online' }).length
    var connecting = entries.filter(function (entry) { return entry.status === 'connecting' }).length
    var parts = ['<b>' + online + '</b> / ' + entries.length + ' 台在线']
    if (connecting > 0) parts.push(connecting + ' 台采集中')
    if (data.sources && (data.sources.sshConfig || data.sources.manual)) {
      var src = []
      if (data.sources.sshConfig) src.push('SSH 配置 ' + data.sources.sshConfig)
      if (data.sources.manual) src.push('手动添加 ' + data.sources.manual)
      parts.push(src.join(' · '))
    }
    if (data.summary && data.summary.hiddenAuth > 0) {
      parts.push('已隐藏 ' + data.summary.hiddenAuth + ' 台认证失败')
    }
    if (data.sources && data.sources.selectionMode === 'selected') {
      parts.push('仅显示选中 ' + (data.sources.visible || 0) + ' 台')
    }
    if (data.summary && data.summary.hiddenRemoved > 0) {
      parts.push('已移除 ' + data.summary.hiddenRemoved + ' 台')
    }
    parts.push(state.interval > 0 ? '每 ' + Math.round(state.interval / 1000) + ' 秒刷新' : '手动刷新')
    parts.push('更新于 ' + fmtRelative(state.lastUpdate))
    els.summary.innerHTML = parts.join(' · ')
    els.summary.title = '数据来源：' + (data.sources ? (data.sources.sshConfigFile || '') : '')

    var offlineNames = entries.filter(function (entry) { return entry.status === 'offline' }).map(function (entry) { return entry.name })
    var footParts = []
    if (offlineNames.length > 0) footParts.push('离线：' + offlineNames.join('、'))
    if (data.summary && data.summary.hiddenAuth > 0) {
      footParts.push('已隐藏 ' + data.summary.hiddenAuth + ' 台认证失败（可在“添加服务器”里修改）')
    }
    if (data.summary && data.summary.hiddenRemoved > 0) {
      footParts.push('已移除 ' + data.summary.hiddenRemoved + ' 台（可在“添加服务器”里恢复）')
    }
    els.foot.textContent = footParts.join(' · ')
  }

  function findEntryById(hostId) {
    if (!state.data) return null
    if (hostId === 'local') return state.data.local || null
    var remotes = state.data.remotes || []
    for (var i = 0; i < remotes.length; i += 1) {
      if (remotes[i].id === hostId) return remotes[i]
    }
    return null
  }

  function openDrawer(entry) {
    state.drawerHostId = entry.id
    state.drawerData = null
    state.drawerError = null
    state.procFilter = ''
    state.dockerSections = { images: false, running: false, stopped: false }
    state.dockerExpanded = Object.create(null)
    state.dockerSelected = { images: new Set(), containers: new Set() }
    state.dockerFocusId = null
    state.dockerBatch = null
    els.drawerBackdrop.hidden = false
    document.body.style.overflow = 'hidden'
    updateDrawerHeader(entry)
    renderDrawer()
    loadDrawerDetails(true)
  }

  function closeDrawer() {
    state.drawerHostId = null
    window.clearTimeout(state.drawerTimer)
    els.drawerBackdrop.hidden = true
    document.body.style.overflow = ''
  }

  function updateDrawerHeader(entry) {
    if (!entry) return
    els.drawerTitle.textContent = (entry.name || entry.host || '节点详情')
    var parts = []
    if (entry.kind === 'local') parts.push('本机')
    else parts.push((entry.username ? entry.username + '@' : '') + entry.host + ':' + (entry.port || 22))
    if (entry.osName) parts.push(entry.osName)
    if (entry.uptime) parts.push('运行 ' + fmtUptime(entry.uptime))
    if (entry.latencyMs !== null && entry.latencyMs !== undefined) parts.push(entry.latencyMs + ' ms')
    els.drawerSub.textContent = parts.join(' · ')
  }

  function scheduleDrawer() {
    window.clearTimeout(state.drawerTimer)
    if (!state.drawerHostId || !els.drawerAuto.checked || document.hidden) return
    state.drawerTimer = window.setTimeout(function () {
      loadDrawerDetails(false)
    }, 3000)
  }

  function loadDrawerDetails(force) {
    var hostId = state.drawerHostId
    if (!hostId || state.drawerLoading) return
    state.drawerLoading = true
    els.drawerRefresh.disabled = true
    els.drawerRefresh.classList.toggle('spin', true)
    var url = 'api/hosts/' + encodeURIComponent(hostId) + '/details' + (force ? '?force=1' : '')
    fetch(url, { cache: 'no-store', headers: { accept: 'application/json' } })
      .then(function (response) {
        return response.json().then(function (body) { return { response: response, body: body } })
      })
      .then(function (result) {
        if (!result.response.ok || !result.body || result.body.ok !== true) {
          throw new Error((result.body && result.body.error) || ('HTTP ' + result.response.status))
        }
        if (state.drawerHostId !== hostId) return
        state.drawerData = result.body
        state.drawerError = null
        els.tabCountTop.textContent = String((result.body.processes || []).length)
        els.tabCountVram.textContent = String((result.body.acceleratorProcesses || []).length)
        updateDrawerHeader(findEntryById(hostId))
        renderDrawer()
      })
      .catch(function (error) {
        if (state.drawerHostId !== hostId) return
        state.drawerError = (error && error.message) || String(error)
        renderDrawer()
      })
      .finally(function () {
        state.drawerLoading = false
        els.drawerRefresh.disabled = false
        els.drawerRefresh.classList.remove('spin')
        scheduleDrawer()
      })
  }

  function miniMeter(pct, labelText) {
    var wrap = el('div', 'mini-meter')
    var bar = el('div', 'bar')
    var fill = el('i', toneFor(pct))
    fill.style.width = (clampPct(pct) === null ? 0 : clampPct(pct)) + '%'
    bar.appendChild(fill)
    wrap.appendChild(bar)
    wrap.appendChild(el('span', '', labelText))
    return wrap
  }

  function renderTopProcesses(data) {
    var procs = (data && data.processes) || []
    var toolbar = el('div', 'proc-toolbar')
    var search = el('label', 'field')
    var input = document.createElement('input')
    input.type = 'search'
    input.placeholder = '过滤 PID / 用户 / 进程名'
    input.value = state.procFilter
    input.addEventListener('input', function () {
      state.procFilter = String(input.value || '').trim().toLowerCase()
      applyProcFilter()
    })
    search.appendChild(input)
    toolbar.appendChild(search)
    var meta = el('span', 'proc-meta', '采样于 ' + fmtRelative(data.sampledAt) + ' · 共 ' + procs.length + ' 个进程')
    meta.id = 'proc-filter-meta'
    meta.setAttribute('data-base', '采样于 ' + fmtRelative(data.sampledAt) + ' · 共 ' + procs.length + ' 个进程')
    toolbar.appendChild(meta)
    els.drawerBody.appendChild(toolbar)

    var filtered = procs.slice()

    filtered.sort(function (a, b) {
      var k = state.procSortKey
      var dir = state.procSortDir === 'asc' ? 1 : -1
      var va = a[k]
      var vb = b[k]
      if (typeof va === 'string' || typeof vb === 'string') {
        return String(va || '').localeCompare(String(vb || '')) * dir
      }
      return ((Number(va) || 0) - (Number(vb) || 0)) * dir
    })

    if (!filtered.length) {
      els.drawerBody.appendChild(el('div', 'target-empty', '没有进程数据。'))
      return
    }

    var wrap = el('div', 'table-wrap')
    var table = el('table', 'proc-table')
    var thead = document.createElement('thead')
    var htr = document.createElement('tr')
    var cols = [
      { key: 'pid', label: 'PID' },
      { key: 'user', label: '用户' },
      { key: 'cpuPercent', label: 'CPU' },
      { key: 'memPercent', label: '内存' },
      { key: 'rssBytes', label: 'RSS 物理内存' },
      { key: 'state', label: '状态' },
      { key: 'command', label: '命令' }
    ]
    cols.forEach(function (col) {
      var arrow = state.procSortKey === col.key ? (state.procSortDir === 'asc' ? ' ▲' : ' ▼') : ''
      var th = el('th', 'sortable', col.label + arrow)
      th.addEventListener('click', function () {
        if (state.procSortKey === col.key) {
          state.procSortDir = state.procSortDir === 'desc' ? 'asc' : 'desc'
        } else {
          state.procSortKey = col.key
          state.procSortDir = (col.key === 'user' || col.key === 'command' || col.key === 'pid') ? 'asc' : 'desc'
        }
        renderDrawer()
      })
      htr.appendChild(th)
    })
    htr.appendChild(el('th', '', '操作'))
    thead.appendChild(htr)
    table.appendChild(thead)

    var tbody = document.createElement('tbody')
    filtered.forEach(function (p) {
      var tr = document.createElement('tr')
      tr.setAttribute('data-proc-hay', [p.pid, p.user, p.command, p.state].join(' ').toLowerCase())
      tr.appendChild(el('td', 'mono', p.pid))
      tr.appendChild(el('td', '', p.user || '—'))
      var cpuTd = document.createElement('td')
      if (p.cpuTimeSec !== undefined && p.cpuPercent === p.cpuTimeSec) {
        cpuTd.textContent = p.cpuTimeSec + 's'
      } else {
        cpuTd.appendChild(miniMeter(p.cpuPercent, fmtPct(p.cpuPercent)))
      }
      tr.appendChild(cpuTd)
      var memTd = document.createElement('td')
      memTd.appendChild(miniMeter(p.memPercent, fmtPct(p.memPercent)))
      tr.appendChild(memTd)
      tr.appendChild(el('td', 'mono', fmtBytes(p.rssBytes)))
      tr.appendChild(el('td', 'mono', p.state || '—'))
      var cmdTd = el('td', 'cmd-cell mono', p.command)
      cmdTd.title = p.command
      tr.appendChild(cmdTd)
      var actionTd = document.createElement('td')
      var abortBtn = el('button', 'btn warn proc-action-btn', '中止')
      abortBtn.type = 'button'
      abortBtn.title = '中止进程 ' + p.pid
      abortBtn.addEventListener('click', function (event) {
        event.stopPropagation()
        openKillModal(p)
      })
      actionTd.appendChild(abortBtn)
      tr.appendChild(actionTd)
      tbody.appendChild(tr)
    })
    var noMatch = document.createElement('tr')
    noMatch.id = 'proc-no-match'
    noMatch.hidden = true
    var noMatchTd = document.createElement('td')
    noMatchTd.colSpan = 8
    noMatchTd.className = 'target-empty'
    noMatchTd.textContent = '没有匹配的进程。'
    noMatch.appendChild(noMatchTd)
    tbody.appendChild(noMatch)
    table.appendChild(tbody)
    wrap.appendChild(table)
    els.drawerBody.appendChild(wrap)
    applyProcFilter()
  }

  function applyProcFilter() {
    var tbody = els.drawerBody.querySelector('tbody')
    if (!tbody) return
    var rows = tbody.querySelectorAll('tr[data-proc-hay]')
    var filter = state.procFilter || ''
    var visible = 0
    rows.forEach(function (row) {
      var match = filter === '' || String(row.getAttribute('data-proc-hay') || '').indexOf(filter) >= 0
      row.hidden = !match
      if (match) visible += 1
    })
    var noMatch = document.getElementById('proc-no-match')
    if (noMatch) noMatch.hidden = visible !== 0
    var meta = document.getElementById('proc-filter-meta')
    if (meta) meta.textContent = (meta.getAttribute('data-base') || '') + (filter === '' ? '' : ' · 匹配 ' + visible + ' 个')
  }

  function renderVramProcesses(data) {
    var list = (data && data.acceleratorProcesses) || []
    var cards = (data && data.accelerators) || []
    var meta = el('div', 'proc-toolbar')
    meta.appendChild(el('span', 'proc-meta', '已识别算力卡 ' + cards.length + ' 张 · 显存占用进程 ' + list.length + ' 个'))
    els.drawerBody.appendChild(meta)

    if (!cards.length) {
      els.drawerBody.appendChild(el('div', 'target-empty', '该节点未检测到 NVIDIA GPU、华为昇腾 NPU 或海光 DCU。'))
      return
    }
    if (!list.length) {
      els.drawerBody.appendChild(el('div', 'target-empty', '当前没有正在占用显存的计算进程。'))
      return
    }

    var wrap = el('div', 'table-wrap')
    var table = el('table', 'proc-table')
    var thead = document.createElement('thead')
    var htr = document.createElement('tr')
    ;['类型', '卡号 / 设备', 'PID', '服务名', '显存占用', '占该卡比例', '容器', '操作'].forEach(function (label) {
      htr.appendChild(el('th', '', label))
    })
    thead.appendChild(htr)
    table.appendChild(thead)

    var tbody = document.createElement('tbody')
    list.forEach(function (p) {
      var tr = document.createElement('tr')
      var type = (p.type === 'npu' || p.type === 'dcu') ? p.type : 'gpu'
      var badgeTd = document.createElement('td')
      badgeTd.appendChild(el('span', 'acc-badge ' + type, accLabel(type)))
      tr.appendChild(badgeTd)
      var devText = (p.deviceIndex !== null && p.deviceIndex !== undefined ? '#' + p.deviceIndex + ' ' : '') + (p.deviceName || '')
      tr.appendChild(el('td', '', devText || '—'))
      tr.appendChild(el('td', 'mono', p.pid))
      var nameTd = el('td', 'cmd-cell mono', p.serviceName || p.name)
      nameTd.title = p.unit || p.name
      tr.appendChild(nameTd)
      tr.appendChild(el('td', 'mono', fmtBytes(p.memoryUsed)))
      var pctTd = document.createElement('td')
      pctTd.appendChild(miniMeter(p.memoryPercent, fmtPct(p.memoryPercent)))
      tr.appendChild(pctTd)
      var containerTd = el('td', 'docker-container-cell', p.containerName || '宿主机进程')
      if (p.containerName) containerTd.title = p.containerStatus || p.containerName
      tr.appendChild(containerTd)
      var actionTd = document.createElement('td')
      if (p.containerName) {
        var locateBtn = el('button', 'btn info proc-action-btn', '定位')
        locateBtn.type = 'button'
        locateBtn.title = '定位容器 ' + p.containerName
        locateBtn.addEventListener('click', function (event) {
          event.stopPropagation()
          focusDockerFromProcess(p.containerId)
        })
        actionTd.appendChild(locateBtn)
      } else {
        var killBtn = el('button', 'btn warn proc-action-btn', '停止')
        killBtn.type = 'button'
        killBtn.title = '停止进程 ' + p.pid
        killBtn.addEventListener('click', function (event) {
          event.stopPropagation()
          openKillModal(p)
        })
        actionTd.appendChild(killBtn)
      }
      tr.appendChild(actionTd)
      tbody.appendChild(tr)
    })
    table.appendChild(tbody)
    wrap.appendChild(table)
    els.drawerBody.appendChild(wrap)
  }

  function dockerButton(label, kind, action, item, tone) {
    var button = el('button', 'btn docker-action-btn' + (tone ? ' ' + tone : ''), label)
    button.type = 'button'
    button.addEventListener('click', function (event) {
      event.stopPropagation()
      openDockerAction(kind, action, item)
    })
    return button
  }

  function dockerPortText(container) {
    if (container.ports) return '端口 ' + container.ports
    if (/host/i.test(container.networks || '')) return 'host 网络（使用宿主端口）'
    return '未映射端口'
  }

  function dockerMeta(parts) {
    var row = el('div', 'docker-meta')
    parts.filter(Boolean).forEach(function (part) { row.appendChild(el('span', '', part)) })
    return row
  }

  function dockerSection(key, title, items, renderItem, emptyText) {
    var section = el('div', 'docker-section')
    var open = state.dockerSections[key] === true
    var toggle = el('button', 'docker-section-toggle')
    toggle.type = 'button'
    var arrow = el('span', 'arrow', open ? '▾' : '▸')
    toggle.appendChild(arrow)
    toggle.appendChild(el('span', '', title + '（' + items.length + '）'))
    var body = el('div', 'docker-section-body')
    body.hidden = !open
    if (!items.length) body.appendChild(el('div', 'target-empty', emptyText))
    else items.forEach(function (item) { body.appendChild(renderItem(item)) })
    toggle.addEventListener('click', function () {
      var next = body.hidden
      body.hidden = !next
      arrow.textContent = next ? '▾' : '▸'
      state.dockerSections[key] = next
    })
    section.appendChild(toggle)
    section.appendChild(body)
    els.drawerBody.appendChild(section)
  }

  function dockerInspectRow(label, value) {
    var row = el('div', 'docker-detail-row')
    row.appendChild(el('span', 'k', label))
    row.appendChild(el('span', 'v', value == null || value === '' ? '—' : String(value)))
    return row
  }

  function dockerInspectBlock(label, text) {
    var row = el('div', 'docker-detail-row')
    row.appendChild(el('span', 'k', label))
    var value = el('span', 'v')
    value.appendChild(el('pre', 'docker-code', text || '—'))
    row.appendChild(value)
    return row
  }

  function dockerTime(value) {
    if (!value || String(value).startsWith('0001-')) return '—'
    var date = new Date(value)
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN')
  }

  function renderDockerInspect(detail, data) {
    detail.textContent = ''
    var networks = (data.networks || []).map(function (network) {
      return network.name + (network.ip ? ' · ' + network.ip : '')
    }).join('，')
    var mounts = (data.mounts || []).map(function (mount) {
      return mount.source + ' → ' + mount.destination + (mount.readOnly ? '（只读）' : '')
    }).join('\n')
    detail.appendChild(dockerInspectRow('容器 ID', data.id))
    detail.appendChild(dockerInspectRow('镜像', data.image))
    detail.appendChild(dockerInspectRow('启动命令', data.command))
    detail.appendChild(dockerInspectRow('Entrypoint', (data.entrypoint || []).join(' ')))
    detail.appendChild(dockerInspectRow('Cmd', (data.cmd || []).join(' ')))
    detail.appendChild(dockerInspectBlock('环境变量', (data.env || []).join('\n')))
    if (data.workingDir) detail.appendChild(dockerInspectRow('工作目录', data.workingDir))
    if (data.user) detail.appendChild(dockerInspectRow('运行用户', data.user))
    detail.appendChild(dockerInspectRow('特权模式', data.privileged ? '是' : '否'))
    if (data.capAdd && data.capAdd.length) detail.appendChild(dockerInspectRow('CapAdd', data.capAdd.join('，')))
    if (data.devices && data.devices.length) detail.appendChild(dockerInspectRow('设备', data.devices.join('，')))
    if (data.runtime) detail.appendChild(dockerInspectRow('Runtime', data.runtime))
    if (data.memory) detail.appendChild(dockerInspectRow('内存限制', fmtBytes(data.memory)))
    if (data.nanoCpus) detail.appendChild(dockerInspectRow('CPU 限制', (data.nanoCpus / 1e9).toFixed(2) + ' 核'))
    detail.appendChild(dockerInspectRow('状态', data.status + (data.exitCode !== null ? '（退出码 ' + data.exitCode + '）' : '')))
    detail.appendChild(dockerInspectRow('创建时间', dockerTime(data.created)))
    if (data.startedAt) detail.appendChild(dockerInspectRow('启动时间', dockerTime(data.startedAt)))
    if (data.finishedAt) detail.appendChild(dockerInspectRow('结束时间', dockerTime(data.finishedAt)))
    detail.appendChild(dockerInspectRow('重启策略', data.restartPolicy || 'no'))
    detail.appendChild(dockerInspectRow('网络模式', data.networkMode))
    detail.appendChild(dockerInspectRow('网络', networks))
    detail.appendChild(dockerInspectRow('端口', (data.ports || []).join('，')))
    detail.appendChild(dockerInspectRow('挂载', mounts))
  }

  function attachDockerDetail(card, container) {
    var hostId = state.drawerHostId
    var key = String(hostId) + '|' + container.id
    var open = state.dockerExpanded[key] === true
    var detail = el('div', 'docker-detail')
    detail.hidden = !open
    var detailBtn = el('button', 'btn docker-action-btn docker-detail-btn', open ? '收起' : '详情')
    detailBtn.type = 'button'
    detailBtn.title = open ? '收起容器启动参数' : '展开容器启动参数'
    detailBtn.setAttribute('aria-label', '展开容器启动参数')

    function loadDetail() {
      var cached = state.dockerInspectCache[key]
      if (cached) {
        renderDockerInspect(detail, cached)
        return
      }
      detail.textContent = '正在加载容器详情…'
      fetch('api/hosts/' + encodeURIComponent(hostId) + '/docker/inspect?target=' + encodeURIComponent(container.id), {
        cache: 'no-store',
        headers: { accept: 'application/json' },
      })
        .then(function (response) {
          return response.json().catch(function () { return {} }).then(function (body) {
            return { ok: response.ok, body: body }
          })
        })
        .then(function (result) {
          if (!result.ok || !result.body || result.body.ok !== true) {
            throw new Error((result.body && result.body.error) || '加载容器详情失败')
          }
          state.dockerInspectCache[key] = result.body.container
          renderDockerInspect(detail, result.body.container)
        })
        .catch(function (error) {
          detail.textContent = '加载失败：' + ((error && error.message) || String(error))
        })
    }

    detailBtn.addEventListener('click', function (event) {
      event.stopPropagation()
      var opening = detail.hidden
      detail.hidden = !opening
      state.dockerExpanded[key] = opening
      detailBtn.textContent = opening ? '收起' : '详情'
      detailBtn.title = opening ? '收起容器启动参数' : '展开容器启动参数'
      if (opening) loadDetail()
    })

    card.appendChild(detail)
    if (open) loadDetail()
    return detailBtn
  }

  function dockerImageRef(image) {
    return (image.repository || '<none>') + ':' + (image.tag || '<none>')
  }

  function dockerDependents(docker, image) {
    var ref = dockerImageRef(image).toLowerCase()
    return [...(docker.running || []), ...(docker.stopped || [])].filter(function (container) {
      return container.imageId === image.id || String(container.image || '').toLowerCase() === ref
    })
  }

  function dockerCheckbox(kind, item) {
    var box = document.createElement('input')
    box.type = 'checkbox'
    box.setAttribute('data-docker-check', kind + ':' + item.id)
    box.checked = state.dockerSelected[kind].has(item.id)
    box.addEventListener('click', function (event) { event.stopPropagation() })
    box.addEventListener('change', function () {
      if (box.checked) state.dockerSelected[kind].add(item.id)
      else state.dockerSelected[kind].delete(item.id)
      updateDockerBatchBar()
    })
    return box
  }

  function updateDockerBatchBar() {
    var bar = document.getElementById('docker-batch-bar')
    if (!bar) return
    var total = state.dockerSelected.images.size + state.dockerSelected.containers.size
    bar.hidden = total === 0
    var label = bar.querySelector('[data-count]')
    if (label) label.textContent = '已选 ' + total + ' 个'
  }

  function dockerBatchDelete(kind) {
    var selected = [...state.dockerSelected[kind]]
    if (selected.length === 0) return
    var label = kind === 'images' ? '镜像' : '容器'
    if (!window.confirm('确认批量删除 ' + selected.length + ' 个' + label + '？此操作不可恢复。')) return
    fetch('api/hosts/' + encodeURIComponent(state.drawerHostId) + '/docker/batch', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-monitor-token': writeToken },
      body: JSON.stringify({ kind: kind === 'images' ? 'image' : 'container', action: kind === 'images' ? 'rmi' : 'rm', targets: selected }),
    })
      .then(function (response) { return response.json() })
      .then(function (body) {
        var failures = (body.results || []).filter(function (item) { return !item.ok })
        if (failures.length) {
          var text = failures.map(function (item) {
            var names = (item.blockingContainers || []).map(function (c) { return c.name }).join('、')
            return item.target + '：' + item.error + (names ? '（容器：' + names + '）' : '')
          }).join('\n')
          window.alert('部分删除失败：\n' + text)
        }
        state.dockerSelected[kind] = new Set()
        loadDrawerDetails(true)
      })
      .catch(function (error) { window.alert('批量删除失败：' + (error.message || error)) })
  }

  function focusDockerFromProcess(id) {
    state.drawerTab = 'docker'
    document.querySelectorAll('.drawer-tabs .tab-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === 'docker')
    })
    focusDockerContainer(id)
  }

  function focusDockerContainer(id) {
    var container = [...((state.drawerData && state.drawerData.docker && state.drawerData.docker.running) || []), ...((state.drawerData && state.drawerData.docker && state.drawerData.docker.stopped) || [])]
      .find(function (item) { return item.id === id })
    if (!container) return
    var section = ((state.drawerData.docker.running || []).some(function (item) { return item.id === id })) ? 'running' : 'stopped'
    state.dockerSections[section] = true
    state.dockerFocusId = id
    renderDrawer()
    window.setTimeout(function () {
      var card = document.querySelector('[data-container-id="' + id + '"]')
      if (!card) return
      card.scrollIntoView({ behavior: 'smooth', block: 'center' })
      card.classList.add('docker-flash')
      window.setTimeout(function () { card.classList.remove('docker-flash') }, 1600)
    }, 80)
  }

  function renderDockerProcesses(data) {
    var docker = (data && data.docker) || { available: false, images: [], running: [], stopped: [] }
    if (!docker.available) {
      els.drawerBody.appendChild(el('div', 'target-empty', '未检测到 Docker，或当前用户没有 Docker 权限。'))
      return
    }
    els.drawerBody.appendChild(el('div', 'proc-meta', '镜像 ' + docker.images.length + ' 个 · 运行中容器 ' + docker.running.length + ' 个 · 停止容器 ' + docker.stopped.length + ' 个'))
    var bar = el('div', 'docker-batch-bar')
    bar.id = 'docker-batch-bar'
    bar.hidden = true
    bar.appendChild(el('span', '', '已选 0 个')).setAttribute('data-count', '')
    var batchImages = el('button', 'btn danger docker-action-btn', '批量删除镜像')
    batchImages.type = 'button'
    batchImages.addEventListener('click', function () { dockerBatchDelete('images') })
    var batchContainers = el('button', 'btn danger docker-action-btn', '批量删除容器')
    batchContainers.type = 'button'
    batchContainers.addEventListener('click', function () { dockerBatchDelete('containers') })
    bar.appendChild(batchImages)
    bar.appendChild(batchContainers)
    els.drawerBody.appendChild(bar)

    dockerSection('images', '镜像列表', docker.images, function (image) {
      var card = el('div', 'docker-card')
      var head = el('div', 'docker-card-head')
      var left = el('div', 'docker-left')
      left.appendChild(dockerCheckbox('images', image))

  function copyDrawerSummary() {
    var entry = findEntryById(state.drawerHostId)
    if (!entry) return
    var lines = []
    lines.push('### ' + (entry.name || entry.host || '主机') + ' (' + (entry.kind === 'local' ? '本机' : (entry.host + ':' + (entry.port || 22))) + ')')
    if (entry.osName) lines.push('- 系统: ' + entry.osName + (entry.kernel ? ' (' + entry.kernel + ')' : ''))
    if (entry.container && entry.container.isContainer) {
      lines.push('- 环境: 容器' + (entry.container.cpuLimit ? ' · CPU限额 ' + entry.container.cpuLimit + '核' : '') + (entry.container.memLimitBytes ? ' · 内存限额 ' + fmtBytes(entry.container.memLimitBytes) : ''))
    }
    if (entry.cpu) lines.push('- CPU: ' + fmtPct(entry.cpu.usage) + (entry.cpu.cores ? ' (' + entry.cpu.cores + ' 核)' : '') + (entry.load ? ' · 负载 ' + fmtLoad(entry.load) : ''))
    if (entry.memory) lines.push('- 内存: ' + fmtPct(entry.memory.percent) + ' (' + fmtBytes(entry.memory.used) + ' / ' + fmtBytes(entry.memory.total) + ')')
    if (entry.disk) lines.push('- 磁盘: ' + fmtPct(entry.disk.percent) + ' (' + fmtBytes(entry.disk.used) + ' / ' + fmtBytes(entry.disk.total) + ')')
    if (entry.network && entry.network.rxBps !== null && entry.network.rxBps !== undefined) {
      lines.push('- 网络: ↓ ' + fmtRate(entry.network.rxBps) + ' / ↑ ' + fmtRate(entry.network.txBps))
    }
    var gpus = (state.drawerData && state.drawerData.accelerators) || entry.gpus || []
    if (gpus.length) {
      lines.push('- 算力卡:')
      gpus.forEach(function (g, i) {
        lines.push('  - [' + accLabel(g.type) + ' #' + (g.index ?? i) + '] ' + g.name + ': 平均利用率 ' + fmtPct(accelUtil(g)) + ', 功耗 ' + (g.powerW != null ? Math.round(g.powerW) + ' W' + (g.powerLimit != null ? ' / ' + Math.round(g.powerLimit) + ' W' : '') : '—') + ', ' + (g.memoryLabel || '显存') + ' ' + fmtBytes(g.memoryUsed) + ' / ' + fmtBytes(g.memoryTotal) + ' (' + fmtPct(g.memoryPercent) + ')' + (g.temperature != null ? ', ' + g.temperature + '°C' : ''))
      })
    }
    var procs = (state.drawerData && state.drawerData.processes) || []
    if (procs.length) {
      lines.push('- Top 5 进程:')
      procs.slice(0, 5).forEach(function (p) {
        lines.push('  - PID ' + p.pid + ' (' + p.user + '): CPU ' + fmtPct(p.cpuPercent) + ', 内存 ' + fmtPct(p.memPercent) + ' · ' + p.command)
      })
    }
    var accProcs = (state.drawerData && state.drawerData.acceleratorProcesses) || []
    if (accProcs.length) {
      lines.push('- 显存占用进程:')
      accProcs.forEach(function (p) {
        lines.push('  - [' + accLabel(p.type) + ' #' + p.deviceIndex + '] PID ' + p.pid + ' ' + p.name + ': ' + fmtBytes(p.memoryUsed))
      })
    }
    var text = lines.join('\n')
    var done = function () {
      var old = els.drawerCopy.textContent
      els.drawerCopy.textContent = '已复制'
      window.setTimeout(function () { els.drawerCopy.textContent = old }, 1500)
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { showBanner('复制失败，请手动复制') })
    }
  }

  var scopeState = { mode: 'all', keys: [], candidates: [] }

  function scopeMode() {
    var checked = document.querySelector('input[name="scope-mode"]:checked')
    return checked && checked.value === 'selected' ? 'selected' : 'all'
  }

  function setScopeMode(mode) {
    var radios = document.querySelectorAll('input[name="scope-mode"]')
    for (var i = 0; i < radios.length; i += 1) radios[i].checked = radios[i].value === mode
  }

  function renderScope() {
    els.scopeRows.textContent = ''
    if (scopeState.candidates.length === 0) {
      els.scopeRows.appendChild(el('div', 'target-empty', '没有可选的服务器（~/.ssh/config 里没有发现主机）。'))
      return
    }
    scopeState.candidates.forEach(function (candidate) {
      var row = el('label', 'scope-row')
      var box = document.createElement('input')
      box.type = 'checkbox'
      box.value = candidate.key
      box.checked = scopeState.keys.indexOf(candidate.key) >= 0
      box.addEventListener('change', function () {
        var index = scopeState.keys.indexOf(candidate.key)
        if (box.checked && index < 0) scopeState.keys.push(candidate.key)
        if (!box.checked && index >= 0) scopeState.keys.splice(index, 1)
      })
      row.appendChild(box)
      var who = el('div', 'who')
      who.appendChild(el('b', '', candidate.name || candidate.host))
      who.appendChild(document.createTextNode(' ' + (candidate.username || '') + '@' + candidate.host + ':' + candidate.port))
      row.appendChild(who)
      row.appendChild(el('span', 'tag', candidate.source === 'ssh-config' ? 'SSH 配置' : 'SSH 配置'))
      els.scopeRows.appendChild(row)
    })
  }

      })
      .then(function (body) {
        if (!body || body.ok !== true) throw new Error((body && body.error) || '加载失败')
        scopeState.mode = body.selection && body.selection.mode === 'selected' ? 'selected' : 'all'
        scopeState.keys = body.selection && Array.isArray(body.selection.keys) ? body.selection.keys.slice() : []
        scopeState.candidates = Array.isArray(body.candidates) ? body.candidates : []
        setScopeMode(scopeState.mode)
        renderScope()
      })
      .catch(function (error) {

  function saveScope() {

      els.scopeMsg.textContent = '页面令牌缺失，请刷新页面后重试'

      return
    }
    var keys = []
    var boxes = els.scopeRows.querySelectorAll('input[type="checkbox"]')
    for (var i = 0; i < boxes.length; i += 1) if (boxes[i].checked) keys.push(boxes[i].value)
    els.scopeMsg.textContent = '保存中…'
    els.scopeMsg.className = 'form-msg'
    fetch('api/selection', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-monitor-token': writeToken },
      body: JSON.stringify({ mode: scopeMode(), keys: keys }),
    }).then(function (response) {
      return response.json().then(function (body) { return { response: response, body: body } })
    }).then(function (result) {
      if (!result.response.ok || !result.body.ok) throw new Error(result.body.error || '保存失败')

      scopeState.keys = result.body.selection.keys

      })

  /** Force one host to be collected again, bypassing any pooled SSH connection. */
  function reconnectHost(entry, button) {
    if (!writeToken) {
      showBanner('页面令牌缺失，请刷新页面后重试')
      return
    }
    var label = button.textContent
    button.disabled = true
    button.textContent = '重连中…'
    fetch('api/hosts/' + encodeURIComponent(entry.id) + '/reconnect', {
      method: 'POST',
      headers: { 'x-monitor-token': writeToken },
    }).then(function (response) {
      return response.json().then(function (body) { return { response: response, body: body } })
    }).then(function (result) {
      if (!result.response.ok || !result.body.ok) throw new Error(result.body.error || '重连失败')
      // Paint the fresh view right away: a failed retry still needs no banner,
      // because the card itself carries the real SSH error message.
      var host = result.body.host
      if (state.data && host && host.id) {
        state.data.remotes = (state.data.remotes || []).map(function (item) {
          return item.id === host.id ? host : item
        })
        render()
      }
      load(true)
    }).catch(function (error) {
      showBanner('重连失败：' + ((error && error.message) || String(error)))
    }).finally(function () {
      button.disabled = false
      button.textContent = label
    })
  }

        })[0]
        startEditTarget(record || {

  /** Card trash button: manual targets are deleted, discovered ones are hidden. */
  function removeServer(entry) {

      return
    }
    var isManual = Boolean(entry.manualId)
    var label = entry.name || entry.host
    var question = isManual
      ? '删除服务器“' + label + '”？密码 / 私钥会一起删除。'
      : '从监控列表移除“' + label + '”？不会修改 ~/.ssh/config，可稍后恢复。'
    if (!window.confirm(question)) return
    var request
    if (isManual) {
      request = fetch('api/targets/' + encodeURIComponent(entry.manualId), {
        method: 'DELETE',
        headers: { 'x-monitor-token': writeToken },
      })
    } else {
      request = fetch('api/hidden', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-monitor-token': writeToken },
        body: JSON.stringify({ host: entry.host, port: entry.port }),
      })

    request.then(function (response) {
      return response.json().then(function (body) { return { response: response, body: body } })
    }).then(function (result) {
      if (!result.response.ok || !result.body.ok) throw new Error(result.body.error || '操作失败')

  function testTargetConnection() {
    if (!writeToken) {
      setTargetMsg('页面令牌缺失，请刷新页面后重试', 'error')
      return
    }
    var body = readTargetPayload()
    els.targetTest.disabled = true
    setTargetMsg('正在测试 SSH 连接…', '')
    fetch('api/targets/test', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-monitor-token': writeToken },
      body: JSON.stringify(body),
    }).then(function (response) {
      return response.json().then(function (payload) { return { response: response, payload: payload } })
    }).then(function (result) {
      if (!result.response.ok || !result.payload.ok) throw new Error(result.payload.error || '连接测试失败')
      var info = result.payload.result || {}
      var parts = ['连接成功', (info.latencyMs != null ? info.latencyMs + ' ms' : '')]
      if (info.osName) parts.push(info.osName)
      if (info.cores) parts.push(info.cores + ' 核')
      if (info.gpus && info.gpus.length) parts.push('识别到 ' + info.gpus.length + ' 张卡 (' + info.gpus[0] + ')')
      setTargetMsg(parts.filter(Boolean).join(' · '), 'ok')
    }).catch(function (error) {
      setTargetMsg('测试失败：' + ((error && error.message) || String(error)), 'error')
    }).finally(function () {
      els.targetTest.disabled = false
    })

  function setBusy(busy) {
    state.busy = busy
    els.refresh.disabled = busy
    els.refresh.classList.toggle('spin', busy)
  }

  function schedule(delayMs) {
    window.clearTimeout(state.timer)
    if (state.interval <= 0 || document.hidden) return
    var delay = delayMs === undefined ? state.interval : delayMs
    state.timer = window.setTimeout(function () { load(false) }, delay)
  }

  function load(force) {
    if (state.busy) return
    setBusy(true)
    var url = 'api/snapshot'
    var params = []
    if (force) params.push('force=1')
    if (isWorkspaceScope && !state.wsShowAll && state.wsBoundHost) params.push('host=' + encodeURIComponent(state.wsBoundHost))
    if (params.length > 0) url += '?' + params.join('&')
    fetch(url, { cache: 'no-store', headers: { accept: 'application/json' } })
      .then(function (response) {
        if (!response.ok) throw new Error('采集服务返回 HTTP ' + response.status)
        return response.json()
      })
      .then(function (data) {
        if (!data || data.ok !== true) throw new Error((data && data.error) || '采集服务返回了无效数据')
        state.data = data
        state.error = null
        state.lastUpdate = Date.now()
        state.pending = (data.remotes || []).some(function (entry) { return entry.status === 'connecting' })
        showBanner(null)
        render()
      })
      .catch(function (error) {
        state.error = (error && error.message) || String(error)
        state.pending = false
        showBanner('采集失败：' + state.error)
        if (!state.data) render()
      })
      .finally(function () {
        setBusy(false)
        // Slow NPU/DCU hosts return as "connecting" after waitMs. Retry soon
        // instead of leaving them pending for the whole refresh interval.
        if (state.pending && state.interval > 0 && state.quickRetries < 8) {
          state.quickRetries += 1
          schedule(2500)
        } else {
          if (!state.pending) state.quickRetries = 0
          schedule()
        }
      })
  }

  function tick() {
    if (!state.lastUpdate) return
    var summary = els.summary
    if (summary && summary.innerHTML) {
      summary.innerHTML = summary.innerHTML.replace(/更新于 [^<·]+$/, '更新于 ' + fmtRelative(state.lastUpdate))
    }
    var stamps = document.querySelectorAll('[data-stamp]')
    for (var i = 0; i < stamps.length; i += 1) {
      var ts = Number(stamps[i].getAttribute('data-stamp')) || state.lastUpdate
      if (stamps[i].textContent.indexOf('离线') === 0) continue
      stamps[i].textContent = '更新 ' + fmtRelative(ts)
    }
  }

  function applyIntervalMs(ms) {
    state.interval = Math.max(0, Number(ms) || 0)

    syncIntervalControls()

  function syncIntervalControls() {
    var val = String(state.interval)
    var presets = ['10000', '30000', '60000', '0']
    if (presets.indexOf(val) >= 0) {
      els.interval.value = val
      els.customIntervalWrap.hidden = true
    } else {
      els.interval.value = 'custom'
      els.customIntervalWrap.hidden = false
      els.customIntervalSec.value = String(Math.max(1, Math.round(state.interval / 1000)))
    }
    if (els.interval._syncCustom) els.interval._syncCustom()
  }

  function applyCustomInterval() {
    var sec = Math.round(Number(els.customIntervalSec.value))
    if (!Number.isFinite(sec) || sec < 1) sec = 1
    if (sec > 3600) sec = 3600
    els.customIntervalSec.value = String(sec)
    applyIntervalMs(sec * 1000)
  }

  els.interval.addEventListener('change', function () {
    if (els.interval.value === 'custom') {
      els.customIntervalWrap.hidden = false
      if (!els.customIntervalSec.value) {
        els.customIntervalSec.value = String(Math.max(1, Math.round((state.interval || 10000) / 1000)))
      }
      els.customIntervalSec.focus()
      els.customIntervalSec.select()
      return
    }
    applyIntervalMs(Number(els.interval.value) || 0)
  })

  function openDockerAction(kind, action, item) {
    var name = kind === 'image'
      ? ((item.repository || '<none>') + ':' + (item.tag || '<none>'))
      : (item.name || item.shortId)
    var labels = {
      rmi: '删除镜像',
      rm: '删除容器',
      stop: '停止容器',
      restart: '重启容器',
      start: '启动容器',
    }
    var questions = {
      rmi: '确认删除镜像「' + name + '」？此操作不可恢复。',
      rm: '确认删除容器「' + name + '」？容器及其可写层会被删除，此操作不可恢复。',
      stop: '确认停止容器「' + name + '」？正在运行的任务会被中断。',
      restart: '确认重启容器「' + name + '」？服务会短暂中断。',
      start: '确认启动容器「' + name + '」？',
    }
    state.dockerTarget = { kind: kind, action: action, target: item.id, name: name }
    els.dockerText.textContent = questions[action] || ('确认执行「' + action + '」？')
    els.dockerError.hidden = true
    els.dockerError.textContent = ''

    els.dockerError.hidden = true
    fetch('api/hosts/' + encodeURIComponent(hostId) + '/docker', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-monitor-token': writeToken },
      body: JSON.stringify({ action: target.action, kind: target.kind, target: target.target }),
    })
      .then(function (response) {
        return response.json().catch(function () { return {} }).then(function (body) {
          return { ok: response.ok, body: body }
        })
      })
      .then(function (result) {
        if (!result.ok || !result.body || result.body.ok !== true) {
          var dockerMsg = (result.body && result.body.error) || 'Docker 操作失败'
          var blockers = (result.body && result.body.blockingContainers) || []
          if (blockers.length) dockerMsg += '（仍在使用：' + blockers.map(function (item) { return item.name }).join('、') + '）'

        els.dockerError.textContent = (error && error.message) || String(error)
        els.dockerConfirm.disabled = false
        els.dockerConfirm.textContent = '重试'
      })

  function confirmKill(signal) {

    var sig = signal === 'KILL' ? 'KILL' : 'TERM'
    els.killConfirm.disabled = true

    els.killConfirm.textContent = sig === 'KILL' ? '强制杀死中…' : '中止中…'
    els.killError.hidden = true
    fetch('api/hosts/' + encodeURIComponent(hostId) + '/kill', {
      method: 'POST',

      body: JSON.stringify({ pid: target.pid, signal: sig }),

      .then(function (response) {

  function enhanceSelect(selectEl) {
    if (!selectEl || selectEl._enhanced) return
    selectEl._enhanced = true
    var wrap = el('span', 'cselect-wrap')
    var btn = el('button', 'cselect-btn')
    btn.type = 'button'
    var labelSpan = el('span', '', '')
    btn.appendChild(labelSpan)
    btn.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>')
